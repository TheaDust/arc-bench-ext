      - id: SCN-REQ-5.2.1-06
        name: REQ-5.2.1 - Set Dropdown or Numeric Validation for a Range - Scenario 6
        steps:
        - id: STEP-REQ-5.2.1-06-01
          Given: A1 is Not Started and A1:A2 have dropdown values Not Started, In Progress, Completed.
          When: The user enters In Progress in A1 and Completed in A2, then refreshes.
          Then: Both selected values display and persist with dropdown controls.
