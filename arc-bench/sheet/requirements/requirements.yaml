id: ROOT
name: Core Requirements for an Online Spreadsheet Data Workspace
description:
  text: |-
    Named form controls use their declared role and exact accessible name. Decorative required-field markers preserve that accessible name. A required label remains associated with its control; native password and file inputs retain their input types.

    A streamlined online spreadsheet application with an interface modeled after Google Sheets, covering workbook and worksheet management, spreadsheet data editing, formula calculation, sorting and filtering, data validation, and basic pivot analysis. Sharing and collaboration, version-history restoration, advanced visual styling, charts, macros, real-time collaborative cursors, and integrations with external office suites are outside the core scope.

    For active workbook, worksheet, selection, clipboard and history state: Established through workbook navigation and editing interactions, including copy, cut, paste, undo and redo. Runtime selections and history are not preloaded.

    For calculation, sort, filter, pivot and export state: Produced through formula entry, sorting, filtering, pivot apply/refresh and export UI. Formula results, sorted rows and pivot aggregates are computed by the application, not supplied as initial values.

    Calculated numeric results are compared by numeric value; harmless decimal trailing zeros, conventional three-digit grouping and scientific notation are equivalent presentations. This does not change ordinary entered/imported text: leading zeros, spaces, blank fields and stored formula expressions remain preserved as specified.
    Native masked password inputs are identified by their exact associated accessible label and password type; an explicit textbox role is not required for these native inputs. Other declared field roles and names remain required. A combobox may use a native select or an accessible popup: choices and selected state are compared by their visible labels, not private option values or a required DOM nesting.

    State terminology: a cell's stored content is either its ordinary input text or its saved formula expression. The grid shows ordinary text or the current calculated result; the Formula bar shows stored content. The terms stored formula and stored expression denote this current unevaluated expression. Raw input means the stored input before calculation. Copy, cut and structural edits may rewrite references as explicitly required; after such an edit, the rewritten expression is the stored formula. Other text, function-name case and dollar markers remain preserved unless the stated transformation changes them.

    Successful data operations expose a coherent result: source and destination content, required reference rewrites, dependent calculations and applicable validation agree before the operation is considered complete. A refused edit preserves the last successful stored state and must not be represented as a successful partial edit. A saved formula error from REQ-4.2.2 is a calculated cell result, distinct from rejection by a validation rule.

    Persistence means that reopening or refreshing the same workbook entry directly restores its last successful workbook and worksheet state, including the active worksheet, saved selection rectangle, content, formulas, rules, filters and last applied pivot result where applicable. The required Undo/Redo history is session-local and need not survive reload. Persistence does not require a particular storage technology or URL format.

    Input interpretation: a value beginning with = is a formula whether entered through the grid, Formula bar, table paste or CSV import. Other input is preserved as ordinary text, including leading zeros, spaces and line breaks. Numeric calculation accepts a complete finite decimal integer or fraction, with an optional sign and decimal exponent, ignoring surrounding whitespace for calculation only. TRUE, date text and other nonnumeric text are not numbers. Formula COUNT counts numeric values, including numeric formula results; pivot COUNT counts records with a nonempty value field, including nonnumeric values. These two COUNT operations have different semantics. For a formula aggregate range with no numeric values, SUM, COUNT, MIN and MAX return 0 and AVERAGE returns #DIV/0!.

    Scored input domain: ranges are finite rectangles in one worksheet; partially locked references such as $A1 or A$1, cross-sheet formulas, string expressions and formulas combining different error causes are outside this version's input domain. Relative A1 and fully absolute $A$1 references may occur together in one formula. Sort keys in a column are homogeneous finite numbers, ISO YYYY-MM-DD dates, or English text, with nonempty keys and no case-only ties; mixed-type precedence, blank-key placement and locale collation are not evaluated. Pivot source headers are distinct and nonempty. Successful SUM/AVERAGE pivot groups in scored cases contain at least one numeric value; rejected nonnumeric summary attempts follow REQ-5.3.1. COUNT supports empty row/column combinations as specified.

    Validation rules in scored scenarios are disjoint or edits to an existing rule's exact range, and existing content satisfies a newly saved rule. Partial overlaps between rule definitions and applying a new rule over existing invalid content are outside the scored input domain. Copy and cut transfer cell content and formulas, not validation/filter/pivot definitions; destination rules remain at their coordinates. Structural insertion/deletion moves or removes rule coverage with its original constrained cells. Blank cells may remain blank under a saved rule; a write of a nonempty value must satisfy it.

    Well-formed external CSV/TSV tables in scored scenarios are rectangular; malformed CSV quoting is tested as the explicit rejection case in REQ-1.3.1. A single terminal record separator does not add an empty record; empty fields, including final columns, are retained. CSV quoting and embedded newlines follow REQ-1.3. Export uses a finite rectangle anchored at A1 that includes the imported or pasted rectangle and all subsequently stored nonempty content, including formula expressions whose results are empty. Visible spare grid rows/columns are not part of that extent. Erasing the final occupied edge of that rectangle and sorting outside its declared data region are outside the scored input domain.

    Conditional infrastructure-failure behavior describes atomic failure handling when an actual failure occurs. Scored scenarios establish ordinary UI states and explicit validation failures; they do not require private fault injection or demonstrate every storage/network failure branch.

scenarios: []
children:
- id: REQ-1
  name: Workbook Access and Lifecycle
  description:
    text: |-
      Supports viewing, opening, creating, renaming, importing, and exporting workbooks within the application. The home page is the entry point for workbooks; successful open, create, and import operations all enter the same editor page, and subsequent operations may modify only the currently opened workbook. After a workbook is opened, created, or imported, the editor state shown in the browser must be a stable workbook state: visiting or refreshing that exact workbook state must open the same workbook rather than another workbook or a temporary blank page, and successful workbook modifications must remain available through that visible workbook state. After returning to the home page or reopening, the workbook name, last-updated time, worksheet order, and last active worksheet remain consistent. Worksheet tabs on the same editor page use the ARIA tab role, with the active tab indicated by aria-selected="true"; the active worksheet grid uses the ARIA grid role, has the accessible name "Worksheet grid", and exposes aria-multiselectable="true". Grid cells use the ARIA gridcell role with their cell coordinates as accessible names (for example, A1); the current cell and every cell within the currently selected rectangular region expose aria-selected="true", while cells outside the region expose aria-selected="false".

      For workbooks created or imported through UI: Created through the blank-workbook dialog or successful CSV import. Workbook names and subsequent renames are supplied at runtime. A rejected import creates no workbook.
  scenarios: []
  children:
  - id: REQ-1.1
    name: Workbook Navigation
    description:
      text: Supports viewing and opening available workbooks from the home page. After a workbook is successfully
        created, renamed, or imported from CSV, returning to or refreshing the home page must show the updated record
        in the list.
      image:
      - id: IMG-WORKBOOK-HOME
        reference: reference/workbook-home.png
        page: workbook_home
    scenarios: []
    children:
    - id: REQ-1.1.1
      name: View and Open a Workbook
      description:
        text: |-
          Users view available workbooks on the workbook home page. Each record displays "Last updated: <last updated value>" and provides a link whose accessible name is the workbook name. After the user clicks the link, the editor displays the same "Last updated: <last updated value>", the corresponding workbook name, worksheet tabs and order, current active worksheet, row and column structure, grid values, formula bar content, filter views, validation entry points, and pivot table results; data from another workbook must not appear in the current grid. The current editor page entry in the browser must be directly accessible and continue to identify the same workbook after refresh; visiting that exact workbook state in the same or a later browser session must restore the workbook’s most recent successful state without requiring navigation through the home page. The entry format is implementation-defined.

          The active worksheet uses grid role with accessible name Worksheet grid and aria-multiselectable=true. Cells use gridcell role and their coordinates as names; the selected cell and cells in a selected rectangular range expose aria-selected=true, and other cells expose aria-selected=false. Worksheet tabs use tab role and expose their active state through aria-selected.

          The current workbook retains its identity when revisiting or refreshing its visible state. Operations apply to the current active worksheet or workbook as stated and must not modify unrelated workbooks or worksheets.

          The workbook home list and editor retain the same workbook name, last-updated value, worksheet order and last active worksheet after successful changes, refresh and reopening.

          On the workbook home page, each workbook record has role group and accessible name "Workbook <workbook name>". The record contains its named workbook link and last-updated text; the timestamp may be inside or beside the link. Record identity, rather than link nesting, associates the metadata with the workbook.
        image:
        - id: IMG-WORKBOOK-HOME
          reference: reference/workbook-home.png
          page: workbook_home
      scenarios:
      - id: SCN-REQ-1.1.1-01
        name: REQ-1.1.1 - View and Open a Workbook - Scenario 1
        steps:
        - id: STEP-REQ-1.1.1-01-01
          Given: The visitor starts on the home page with no workbook selected.
          When: The user creates a blank workbook, renames it with a runtime-unique name, enters a runtime-unique
            value in A1, returns home, and opens that workbook link.
          Then: The editor shows the same workbook name, last-updated text, active Sheet1, and the value in A1;
            after refresh and in a new browser session, the workbook and A1 value remain visible.
          references:
          - \ref[requirement](REQ-1.2.1)
          - \ref[image](IMG-WORKBOOK-HOME)
      - id: SCN-REQ-1.1.1-02
        name: REQ-1.1.1 - View and Open a Workbook - Scenario 2
        steps:
        - id: STEP-REQ-1.1.1-02-01
          Given: Two blank workbooks have been created, each with a different runtime-unique name and a different
            value in A1.
          When: The user returns home, opens the first workbook, and refreshes the editor.
          Then: A1 contains the first workbook's value and the second workbook's value is absent both before and
            after refresh.
          references:
          - \ref[requirement](REQ-1.2.1)
          - \ref[image](IMG-WORKBOOK-HOME)
      children: []
  - id: REQ-1.2
    name: Workbook Creation and Naming
    description:
      text: Supports creating a blank workbook and changing the workbook name; both operations are initiated from
        visible workbook state points on the home page or editor page. After success, the workbook record on the
        home page and the editor title are updated consistently and remain so after refresh or reopening.
    scenarios: []
    children:
    - id: REQ-1.2.1
      name: Create a Blank Workbook
      description:
        text: |-
          Users create a blank workbook from the workbook home page. The home page provides a button with the accessible name "New blank workbook"; clicking it opens the creation page, whose submit button is named "Create". After creation succeeds, the editor opens and shows only a blank worksheet named Sheet1, with Sheet1 active and A1 selected; refreshing or returning to the home page and reopening produces the same state. If creation fails, an error is displayed, the user remains in a retryable state, and no incomplete workbook record may appear on the home page.

          The active worksheet uses grid role with accessible name Worksheet grid and aria-multiselectable=true. Cells use gridcell role and their coordinates as names; the selected cell and cells in a selected rectangular range expose aria-selected=true, and other cells expose aria-selected=false. Worksheet tabs use tab role and expose their active state through aria-selected.

          The current workbook retains its identity when revisiting or refreshing its visible state. Operations apply to the current active worksheet or workbook as stated and must not modify unrelated workbooks or worksheets.

          The workbook home list and editor retain the same workbook name, last-updated value, worksheet order and last active worksheet after successful changes, refresh and reopening.
        image:
        - id: IMG-CREATE-WORKBOOK
          reference: reference/create-workbook.png
          page: workbook_creation
      scenarios:
      - id: SCN-REQ-1.2.1-01
        name: REQ-1.2.1 - Create a Blank Workbook - Scenario 1
        steps:
        - id: STEP-REQ-1.2.1-01-01
          Given: The visitor is on the workbook home page.
          When: The user clicks New blank workbook, submits the creation page with Create, and refreshes the editor.
          Then: The editor contains only blank Sheet1, Sheet1 is active, A1 is selected and empty, and those states
            remain after refresh.
          references:
          - \ref[image](IMG-CREATE-WORKBOOK)
      children: []
    - id: REQ-1.2.2
      name: Rename a Workbook
      description:
        text: |-
          Users can change the workbook name on the workbook editor page. Next to the editor title is a button with the accessible name "Rename workbook"; clicking it displays a text box labeled "Workbook name", prefilled with the last saved name, and a "Save" button. After leading and trailing spaces are trimmed, the name must not be empty; an empty name must be rejected with "Workbook name cannot be empty". After a successful save, both the editor title and the home-page link display the new name; if saving fails, an error is shown and the original name remains displayed. Reopening the workbook shows the most recently saved name.

          The active worksheet uses grid role with accessible name Worksheet grid and aria-multiselectable=true. Cells use gridcell role and their coordinates as names; the selected cell and cells in a selected rectangular range expose aria-selected=true, and other cells expose aria-selected=false. Worksheet tabs use tab role and expose their active state through aria-selected.

          The current workbook retains its identity when revisiting or refreshing its visible state. Operations apply to the current active worksheet or workbook as stated and must not modify unrelated workbooks or worksheets.

          The workbook home list and editor retain the same workbook name, last-updated value, worksheet order and last active worksheet after successful changes, refresh and reopening.
      scenarios:
      - id: SCN-REQ-1.2.2-01
        name: REQ-1.2.2 - Rename a Workbook - Scenario 1
        steps:
        - id: STEP-REQ-1.2.2-01-01
          Given: A newly created workbook contains Existing data in A1.
          When: The user opens Rename workbook, enters a runtime-unique name surrounded by spaces, submits with
            Enter, returns home, reopens the renamed link, and opens the rename dialog again.
          Then: Leading and trailing spaces are removed; the editor and home link show the new name, A1 still contains
            Existing data, and the reopened dialog is prefilled with the trimmed name.
          references:
          - \ref[requirement](REQ-1.1.1)
      - id: SCN-REQ-1.2.2-02
        name: REQ-1.2.2 - Rename a Workbook - Scenario 2
        steps:
        - id: STEP-REQ-1.2.2-02-01
          Given: A newly created workbook is open with a non-empty original name.
          When: The user enters only spaces in the Workbook name field and submits Save, then refreshes and reopens
            the rename dialog.
          Then: The message Workbook name cannot be empty is visible; the original name remains in the editor and
            the reopened field.
          references:
          - \ref[requirement](REQ-1.1.1)
      children: []
  - id: REQ-1.3
    name: CSV Data Exchange
    description:
      text: |-
        Supports importing external CSV data completely as a workbook and exporting the current active worksheet as CSV. After a successful import, the Sheet1 editor page opens and continues to show the complete imported result after refresh or reopening; export reads only the current active worksheet and must not change workbook content or the current interface state.

        For external CSV upload files: External files supplied at import time, not preloaded workbooks. File names use the caller's runtime-unique workbook name followed by .csv. Import does not pre-create application records.

        CSV exchange is compared by decoded cells in their original row and column order, not by one serializer's byte layout. Optional quoting of fields that do not require quotes, LF or CRLF record separators, an optional UTF-8 BOM and a final record separator are equivalent. Embedded line breaks retain their position and count (CRLF and LF encode the same line break); commas, quote characters, spaces, empty fields and leading zeros remain cell data. Exported formulas must decode to their calculated results, not their raw expressions.
    scenarios: []
    children:
    - id: REQ-1.3.1
      name: Import CSV to Create a Workbook
      description:
        text: |-
          Users start an import by clicking the "Import CSV" button on the workbook home page. A dialog named "Import CSV" provides a file control labeled "CSV file" and a "Confirm import" button. The system parses data in the original row and column order, preserves empty fields, supports UTF-8 Chinese text, English text, and numeric text, and correctly handles commas enclosed in double quotes, escaped pairs of double quotes, and line breaks within fields; a field that begins with a double quote but has no closing double quote is invalid CSV and must be rejected with "Invalid CSV file format. Import failed." After a successful import, a new workbook is created whose name is the file name with its final .csv extension removed, and Sheet1 opens with the complete CSV rows, columns, and original text; the first row remains ordinary data. After refresh or reopening, grid content and row/column order remain unchanged. If parsing or import fails, no workbook link with that name may appear on the home page, and no partial import result may be displayed or retained.

          The active worksheet uses grid role with accessible name Worksheet grid and aria-multiselectable=true. Cells use gridcell role and their coordinates as names; the selected cell and cells in a selected rectangular range expose aria-selected=true, and other cells expose aria-selected=false. Worksheet tabs use tab role and expose their active state through aria-selected.

          The current workbook retains its identity when revisiting or refreshing its visible state. Operations apply to the current active worksheet or workbook as stated and must not modify unrelated workbooks or worksheets.

          The workbook home list and editor retain the same workbook name, last-updated value, worksheet order and last active worksheet after successful changes, refresh and reopening.
      scenarios:
      - id: SCN-REQ-1.3.1-01
        name: REQ-1.3.1 - Import CSV to Create a Workbook - Scenario 1
        steps:
        - id: STEP-REQ-1.3.1-01-01
          Given: |-
            The visitor is on the workbook home page and has a CSV containing quoted commas, a quoted newline and quote escapes, UTF-8 English and Chinese text, numeric text including 007, and blank fields.
            The input file uses UTF-8 (text/csv) and a runtime-unique workbook name followed by .csv. Its exact content in JSON string notation is "Name,Note,Count,Blank\r\nAlex,\"Harbor District, East\",42,\r\nJordan,\"They said\"\"hello\"\"\r\nnext line\",3,\r\nAlice,English text 中文,007,". In this notation, \r\n denotes CRLF and \n denotes LF; quoted CSV fields retain embedded line breaks.
          When: The user opens Import CSV, uploads the CSV, and confirms the import.
          Then: The uploaded file opens as a workbook on Sheet1. A1:D1 contains Name, Note, Count, Blank in that order.
            A2 is Alex; B2 is the single field Harbor District, East; C2 is 42 and D2 is empty. A3 is Jordan; B3
            contains They said"hello" followed by the supplied line break and next line; C3 is 3 and D3 is empty. A4 is
            Alice, B4 is English text 中文, C4 is the ordinary text 007 and D4 is empty. Every decoded cell remains at its
            original coordinate after refresh.
      - id: SCN-REQ-1.3.1-02
        name: REQ-1.3.1 - Import CSV to Create a Workbook - Scenario 2
        steps:
        - id: STEP-REQ-1.3.1-02-01
          Given: |-
            The visitor is on the workbook home page.
            The input file uses UTF-8 (text/csv) and a runtime-unique workbook name followed by .csv. Its exact content in JSON string notation is "Name,Note\r\n Alex,\"unfinished quote". In this notation, \r\n denotes CRLF and \n denotes LF; quoted CSV fields retain embedded line breaks.
          When: The user uploads a CSV with an unfinished quoted field and confirms the import.
          Then: The message Invalid CSV file format. Import failed. is visible and no workbook link for that file
            name exists on the home page.
      - id: SCN-REQ-1.3.1-03
        name: REQ-1.3.1 - Import CSV to Create a Workbook - Scenario 3
        steps:
        - id: STEP-REQ-1.3.1-03-01
          Given: |-
            The visitor is on the workbook home page with a three-column CSV containing London, a blank Description cell for Berlin, and counts 1, 2, 3.
            The input file uses UTF-8 (text/csv) and a runtime-unique workbook name followed by .csv. Its exact content in JSON string notation is "City,Description,Count\r\nLondon,Capital,1\r\nBerlin,,2\r\nParis,Finance,3". In this notation, \r\n denotes CRLF and \n denotes LF; quoted CSV fields retain embedded line breaks.
          When: The user uploads and confirms the CSV import.
          Then: The imported workbook shows London in A2, a blank B3, and 3 in C4; these values remain after refresh.
      - id: SCN-REQ-1.3.1-04
        name: REQ-1.3.1 - Import CSV to Create a Workbook - Scenario 4
        steps:
        - id: STEP-REQ-1.3.1-04-01
          Given: |-
            The visitor is on the workbook home page with a single-column CSV containing Title, Alpha, Beta, and Gamma.
            The input file uses UTF-8 (text/csv) and a runtime-unique workbook name followed by .csv. Its exact content in JSON string notation is "Title\r\nAlpha\r\nBeta\r\nGamma". In this notation, \r\n denotes CRLF and \n denotes LF; quoted CSV fields retain embedded line breaks.
          When: The user uploads and confirms the CSV import.
          Then: The workbook opens on Sheet1 with Title in A1 and Gamma in A4, and both values remain after refresh.
      children: []
    - id: REQ-1.3.2
      name: Export the Current Worksheet as CSV
      description:
        text: |-
          Users can export the current active worksheet using the button with the accessible name "Export CSV" on the workbook editor toolbar. Clicking it starts a browser download; the suggested filename ends with ".csv", and the downloaded UTF-8 text is the exported CSV. The exported CSV preserves empty cells within the used range according to the grid’s actual row and column order and correctly escapes text containing commas, quotes, or line breaks. Ordinary cells export their displayed values; formula cells export their current calculated results rather than formula expressions. Before and after export, the active worksheet, filter view, grid values, and formula bar content remain unchanged, and the same state remains after refresh.

          The active worksheet uses grid role with accessible name Worksheet grid and aria-multiselectable=true. Cells use gridcell role and their coordinates as names; the selected cell and cells in a selected rectangular range expose aria-selected=true, and other cells expose aria-selected=false. Worksheet tabs use tab role and expose their active state through aria-selected.

          The current workbook retains its identity when revisiting or refreshing its visible state. Operations apply to the current active worksheet or workbook as stated and must not modify unrelated workbooks or worksheets.

          The workbook home list and editor retain the same workbook name, last-updated value, worksheet order and last active worksheet after successful changes, refresh and reopening.
      scenarios:
      - id: SCN-REQ-1.3.2-01
        name: REQ-1.3.2 - Export the Current Worksheet as CSV - Scenario 1
        steps:
        - id: STEP-REQ-1.3.2-01-01
          Given: |-
            A workbook imported from CSV contains Region/Description/Count/Blank headers, quoted comma and newline text, and formulas E2 = C2*2 and E3 = C3+2.
            The input file uses UTF-8 (text/csv) and a runtime-unique workbook name followed by .csv. Its exact content in JSON string notation is "Region,Description,Count,Blank,Formula result\nWest,\"Contains, commas\",2,,=C2*2\nNorth,\"They said \"\"hello\"\"\n next line\",3,,=C3+2". In this notation, \r\n denotes CRLF and \n denotes LF; quoted CSV fields retain embedded line breaks.
          When: The user exports the current worksheet, refreshes, and exports it again.
          Then: Both downloads are CSV files with the evaluated formula values 4 and 5 and the required CSV quoting,
            blank fields, and multiline text.
          references:
          - \ref[requirement](REQ-1.3.1)
          - \ref[requirement](REQ-4.1.1)
      - id: SCN-REQ-1.3.2-02
        name: REQ-1.3.2 - Export the Current Worksheet as CSV - Scenario 2
        steps:
        - id: STEP-REQ-1.3.2-02-01
          Given: A blank workbook has 2 in A1 and formula =A1*2 in B1.
          When: The user exports Sheet1, selects B1, and refreshes.
          Then: The download decodes to one row with cells 2 and 4; Sheet1 remains active, B1 displays 4, and its formula bar contains =A1*2 before
            and after refresh.
          references:
          - \ref[requirement](REQ-4.1.1)
      - id: SCN-REQ-1.3.2-03
        name: REQ-1.3.2 - Export the Current Worksheet as CSV - Scenario 3
        steps:
        - id: STEP-REQ-1.3.2-03-01
          Given: Sheet1 contains Sheet1 in A1 and a second worksheet Sheet2 contains Sheet2 in A1.
          When: The user exports while Sheet2 is active.
          Then: The CSV contains only Sheet2's value and Sheet2 remains active.
          references:
          - \ref[requirement](REQ-2.1.2)
          - \ref[requirement](REQ-3.1.1)
      - id: SCN-REQ-1.3.2-04
        name: REQ-1.3.2 - Export the Current Worksheet as CSV - Scenario 4
        steps:
        - id: STEP-REQ-1.3.2-04-01
          Given: Sheet1 contains First in A1 and Sheet2 contains Second in A1.
          When: The user switches to Sheet1 and exports.
          Then: The CSV contains only First and Sheet1 remains active.
          references:
          - \ref[requirement](REQ-2.1.2)
          - \ref[requirement](REQ-3.1.1)
      children: []
  - id: REQ-2.1
    name: Worksheet Lifecycle
    description:
      text: |-
        Supports creating, switching, renaming, and deleting worksheets while ensuring that each worksheet’s grid, formulas, validation behavior, filter views, pivot-table field selections, and results remain independent and persist after reopening. The worksheet tab bar displays worksheet order and active state after the most recent successful operation and provides a button with the accessible name "Add worksheet". Each worksheet tab provides a button with the accessible name "Worksheet options for <worksheet name>"; clicking it opens a menu whose commands use the ARIA menuitem role.

        For worksheets owned by UI-created workbooks: Created with the workbook, added through worksheet controls, or created as a pivot destination. Each worksheet belongs to its current workbook; none are separately preloaded.
      image:
      - id: IMG-WORKSHEET-LIFECYCLE
        reference: reference/worksheet-lifecycle.png
        page: workbook_editor
    scenarios: []
    children:
    - id: REQ-2.1.1
      name: Add a Worksheet
      description:
        text: |-
          Users add a worksheet using the button with the accessible name "Add worksheet" in the tab bar of the workbook editor page. The new tab uses the first unused SheetN name in positive-integer order; when only Sheet1 exists, Sheet2 is created. The new worksheet is blank and does not inherit filters, validation, or pivot results from other worksheets; after creation it becomes the active tab and A1 is selected. Existing worksheets and their data remain unchanged. The new tab still exists after refresh or reopening. If addition fails, an error is shown, no new tab appears, and existing worksheets remain unchanged.

          The active worksheet uses grid role with accessible name Worksheet grid and aria-multiselectable=true. Cells use gridcell role and their coordinates as names; the selected cell and cells in a selected rectangular range expose aria-selected=true, and other cells expose aria-selected=false. Worksheet tabs use tab role and expose their active state through aria-selected.

          The current workbook retains its identity when revisiting or refreshing its visible state. Operations apply to the current active worksheet or workbook as stated and must not modify unrelated workbooks or worksheets.

          Worksheet tabs provide a button named Worksheet options for <worksheet name>; it opens commands with menuitem role. Each worksheet keeps independent values, formulas, validation, filters and pivot settings/results, persisted after reopening.
        image:
        - id: IMG-WORKSHEET-LIFECYCLE
          reference: reference/worksheet-lifecycle.png
          page: workbook_editor
      scenarios:
      - id: SCN-REQ-2.1.1-01
        name: REQ-2.1.1 - Add a Worksheet - Scenario 1
        steps:
        - id: STEP-REQ-2.1.1-01-01
          Given: A blank workbook is open with Existing data in Sheet1!A1.
          When: The user adds Sheet2, switches between Sheet1 and Sheet2, and refreshes while Sheet2 is active.
          Then: Sheet2 starts blank and Sheet1 retains Existing data; after refresh Sheet2 is active with A1 selected
            and empty, and Sheet1 is still present.
          references:
          - \ref[requirement](REQ-1.1.1)
          - \ref[image](IMG-WORKSHEET-LIFECYCLE)
      - id: SCN-REQ-2.1.1-02
        name: REQ-2.1.1 - Add a Worksheet - Scenario 2
        steps:
        - id: STEP-REQ-2.1.1-02-01
          Given: A blank workbook is open.
          When: The user adds Sheet2, renames it to Sheet3, adds another Sheet2, and refreshes.
          Then: Sheet1, Sheet3, and Sheet2 are visible; the active worksheet after refresh is Sheet2.
          references:
          - \ref[requirement](REQ-1.1.1)
          - \ref[image](IMG-WORKSHEET-LIFECYCLE)
      children: []
    - id: REQ-2.1.2
      name: Switch Worksheets
      description:
        text: |-
          After the user clicks another ARIA tab, the grid, row and column structure, selected cell, text box labeled "Formula bar", filter buttons, validation entry points, and pivot table results all switch to the state of the target worksheet; the formula bar displays either the ordinary value or the stored formula of the selected cell. A worksheet opened for the first time with no selection history selects A1. Switching must not modify the source worksheet; returning to it restores its most recent successful state. Reopening the workbook directly displays the last active tab and restores the last confirmed selected cell for each worksheet.

          The active worksheet uses grid role with accessible name Worksheet grid and aria-multiselectable=true. Cells use gridcell role and their coordinates as names; the selected cell and cells in a selected rectangular range expose aria-selected=true, and other cells expose aria-selected=false. Worksheet tabs use tab role and expose their active state through aria-selected.

          The current workbook retains its identity when revisiting or refreshing its visible state. Operations apply to the current active worksheet or workbook as stated and must not modify unrelated workbooks or worksheets.

          Worksheet tabs provide a button named Worksheet options for <worksheet name>; it opens commands with menuitem role. Each worksheet keeps independent values, formulas, validation, filters and pivot settings/results, persisted after reopening.
        image:
        - id: IMG-WORKSHEET-LIFECYCLE
          reference: reference/worksheet-lifecycle.png
          page: workbook_editor
      scenarios:
      - id: SCN-REQ-2.1.2-01
        name: REQ-2.1.2 - Switch Worksheets - Scenario 1
        steps:
        - id: STEP-REQ-2.1.2-01-01
          Given: Sheet1 contains 2 in A1 and =A1*2 in B1; Sheet2 contains Other in A1.
          When: The user switches Sheet1, Sheet2, Sheet1, and refreshes.
          Then: 'Each sheet restores its own selected cell and formula bar: Sheet1 selects B1 with =A1*2 and value
            4, while Sheet2 selects A1 with Other.'
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[image](IMG-WORKSHEET-LIFECYCLE)
      - id: SCN-REQ-2.1.2-02
        name: REQ-2.1.2 - Switch Worksheets - Scenario 2
        steps:
        - id: STEP-REQ-2.1.2-02-01
          Given: Sheet1 contains 2 and =A1*2, and Sheet2 contains Other.
          When: The user selects B1, switches to Sheet2 and back to Sheet1, then switches to Sheet2 and refreshes.
          Then: Sheet1 retains B1/value 4/formula =A1*2; Sheet2 retains A1/Other and remains active after refresh.
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[image](IMG-WORKSHEET-LIFECYCLE)
      - id: SCN-REQ-2.1.2-03
        name: REQ-2.1.2 - Switch Worksheets - Scenario 3
        steps:
        - id: STEP-REQ-2.1.2-03-01
          Given: Sheet1 contains a Region/Status table, a dropdown validation on C2, and a filter on A1:B3.
          When: The user adds Sheet2, enters Other sheet in A1, switches between the worksheets, and refreshes Sheet2.
          Then: Filter Region and the C2 dropdown are visible only on Sheet1, absent on Sheet2, and Sheet2 retains
            Other sheet after refresh.
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[requirement](REQ-5.1.2)
          - \ref[requirement](REQ-5.2.1)
          - \ref[image](IMG-WORKSHEET-LIFECYCLE)
      - id: SCN-REQ-2.1.2-04
        name: REQ-2.1.2 - Switch Worksheets - Scenario 4
        steps:
        - id: STEP-REQ-2.1.2-04-01
          Given: Sheet1, Sheet2, and Sheet3 contain Sheet1 in A1, Sheet2 in B2, and Sheet3 in C3 respectively.
          When: The user visits all three worksheet tabs and refreshes while Sheet3 is active.
          Then: Each worksheet restores its own active cell and value; Sheet3 remains active with C3 selected after
            refresh.
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[image](IMG-WORKSHEET-LIFECYCLE)
      - id: SCN-REQ-2.1.2-05
        name: REQ-2.1.2 - Switch Worksheets - Scenario 5
        steps:
        - id: STEP-REQ-2.1.2-05-01
          Given: Sheet1 contains 2 and =A1*3; Sheet2 contains Other.
          When: The user switches between Sheet1 and Sheet2 and selects the displayed cells.
          Then: Sheet1 shows 6 with formula =A1*3, while Sheet2 shows Other with formula bar Other.
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[image](IMG-WORKSHEET-LIFECYCLE)
      children: []
    - id: REQ-2.1.3
      name: Rename a Worksheet
      description:
        text: |-
          Users change a worksheet name from the worksheet tab menu. The "Rename" menu item opens a dialog named "Rename worksheet", containing a text box labeled "Worksheet name" prefilled with the current name and a "Save" button. After trimming leading and trailing spaces, the new name must not be empty and must be unique within the same workbook; an empty name displays "Worksheet name cannot be empty", and a duplicate name displays "Worksheet name already exists". After a successful save, the tab displays the new name; if saving fails, the name is duplicate, or the name is empty, an error is displayed and the original name remains. Refreshing or reopening shows the most recently saved successful name.

          The active worksheet uses grid role with accessible name Worksheet grid and aria-multiselectable=true. Cells use gridcell role and their coordinates as names; the selected cell and cells in a selected rectangular range expose aria-selected=true, and other cells expose aria-selected=false. Worksheet tabs use tab role and expose their active state through aria-selected.

          The current workbook retains its identity when revisiting or refreshing its visible state. Operations apply to the current active worksheet or workbook as stated and must not modify unrelated workbooks or worksheets.

          Worksheet tabs provide a button named Worksheet options for <worksheet name>; it opens commands with menuitem role. Each worksheet keeps independent values, formulas, validation, filters and pivot settings/results, persisted after reopening.
        image:
        - id: IMG-WORKSHEET-LIFECYCLE
          reference: reference/worksheet-lifecycle.png
          page: workbook_editor
      scenarios:
      - id: SCN-REQ-2.1.3-01
        name: REQ-2.1.3 - Rename a Worksheet - Scenario 1
        steps:
        - id: STEP-REQ-2.1.3-01-01
          Given: A blank workbook has Sheet2 with Existing worksheet data in A1.
          When: The user renames Sheet2 to a runtime-unique name with surrounding spaces and refreshes.
          Then: The trimmed new tab name is active, Sheet1 remains visible, A1 still contains Existing worksheet
            data, and the rename dialog is prefilled with the new name.
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[image](IMG-WORKSHEET-LIFECYCLE)
      - id: SCN-REQ-2.1.3-02
        name: REQ-2.1.3 - Rename a Worksheet - Scenario 2
        steps:
        - id: STEP-REQ-2.1.3-02-01
          Given: A workbook contains Sheet1 and Sheet2, with Sheet2 active.
          When: The user tries to rename Sheet2 to Sheet1.
          Then: Worksheet name already exists is visible, Sheet2 remains active, and that state remains after refresh.
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[image](IMG-WORKSHEET-LIFECYCLE)
      - id: SCN-REQ-2.1.3-03
        name: REQ-2.1.3 - Rename a Worksheet - Scenario 3
        steps:
        - id: STEP-REQ-2.1.3-03-01
          Given: A blank workbook with Sheet1 active is open.
          When: The user submits a worksheet name consisting only of spaces.
          Then: Worksheet name cannot be empty is visible; Sheet1 remains active and the dialog still contains Sheet1
            after refresh.
          references:
          - \ref[requirement](REQ-1.1.1)
          - \ref[image](IMG-WORKSHEET-LIFECYCLE)
      children: []
    - id: REQ-2.1.4
      name: Delete a Worksheet
      description:
        text: |-
          Users delete a worksheet through the "Delete" command in the worksheet tab menu. When deletion is allowed, the system displays a dialog named "Delete worksheet" describing the target worksheet, whose visible text includes "<target worksheet name>", and providing a "Delete worksheet" confirmation button. After a successful deletion, the target tab and its data, formulas, filters, validation, and pivot results no longer appear, and an adjacent worksheet becomes active; the target tab remains absent after refresh. After a pivot-result worksheet is deleted, its corresponding source worksheet is no longer constrained by that pivot table. If the target is still a pivot table source worksheet, confirmation is rejected with "Please delete or rebuild dependent pivot tables first"; the dialog closes and both source data and pivot results remain unchanged. If only one worksheet remains, clicking "Delete" does not open a confirmation dialog and instead displays "A workbook must contain at least one worksheet". Other deletion failures display an error; the target tab and grid remain visible and unchanged after refresh.

          The active worksheet uses grid role with accessible name Worksheet grid and aria-multiselectable=true. Cells use gridcell role and their coordinates as names; the selected cell and cells in a selected rectangular range expose aria-selected=true, and other cells expose aria-selected=false. Worksheet tabs use tab role and expose their active state through aria-selected.

          The current workbook retains its identity when revisiting or refreshing its visible state. Operations apply to the current active worksheet or workbook as stated and must not modify unrelated workbooks or worksheets.

          Worksheet tabs provide a button named Worksheet options for <worksheet name>; it opens commands with menuitem role. Each worksheet keeps independent values, formulas, validation, filters and pivot settings/results, persisted after reopening.
        image:
        - id: IMG-WORKSHEET-LIFECYCLE
          reference: reference/worksheet-lifecycle.png
          page: workbook_editor
      scenarios:
      - id: SCN-REQ-2.1.4-01
        name: REQ-2.1.4 - Delete a Worksheet - Scenario 1
        steps:
        - id: STEP-REQ-2.1.4-01-01
          Given: A blank workbook contains Sheet1 and Sheet2.
          When: The user chooses Delete for Sheet2 and confirms Delete worksheet.
          Then: Sheet2 is removed, Sheet1 is active, and Sheet2 remains absent after refresh.
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[image](IMG-WORKSHEET-LIFECYCLE)
      - id: SCN-REQ-2.1.4-02
        name: REQ-2.1.4 - Delete a Worksheet - Scenario 2
        steps:
        - id: STEP-REQ-2.1.4-02-01
          Given: A workbook contains only Sheet1.
          When: The user chooses Delete for Sheet1.
          Then: The message A workbook must contain at least one worksheet is visible, no delete dialog remains,
            and Sheet1 remains active after refresh.
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[image](IMG-WORKSHEET-LIFECYCLE)
      - id: SCN-REQ-2.1.4-03
        name: REQ-2.1.4 - Delete a Worksheet - Scenario 3
        steps:
        - id: STEP-REQ-2.1.4-03-01
          Given: Sheet1 contains a Region/Sales table and a dependent Pivot1 worksheet summarizes Sales by Region.
          When: The user attempts to delete Sheet1 and confirms the delete dialog.
          Then: The message to delete or rebuild dependent pivot tables first is visible; Sheet1 and its data remain,
            Pivot1 remains available with East 100 in B2, and both survive refresh.
          references:
          - \ref[requirement](REQ-5.3.1)
          - \ref[image](IMG-WORKSHEET-LIFECYCLE)
      - id: SCN-REQ-2.1.4-04
        name: REQ-2.1.4 - Delete a Worksheet - Scenario 4
        steps:
        - id: STEP-REQ-2.1.4-04-01
          Given: Sheet1 contains a Region/Sales table, Sheet2 is present, and Pivot1 summarizes the source.
          When: The user deletes Pivot1, then deletes Sheet1, and refreshes.
          Then: Pivot1 and Sheet1 are removed, Sheet2 becomes active, and both remain absent after refresh.
          references:
          - \ref[requirement](REQ-5.3.1)
          - \ref[image](IMG-WORKSHEET-LIFECYCLE)
      children: []
  - id: REQ-2.2
    name: Row and Column Structure Management
    description:
      text: >-
        Supports inserting and deleting rows and columns in the current active worksheet. After an operation, grid
        values, formula bar, filter views, validation behavior, and pivot refresh results remain consistent while other
        worksheets remain unchanged; the structure persists after refresh or reopening. Row numbers use the ARIA
        rowheader role with the decimal row number as the accessible name; column headers use the ARIA columnheader role
        with the column letter as the accessible name. Right-clicking a row number or column header opens a menu whose
        commands use the ARIA menuitem role.


        Reference transformation applies to both relative and absolute coordinates; dollar markers survive and do not
        freeze structural positions. For a referenced interval [start,end], insertion before or at start shifts both
        endpoints; insertion strictly after start and at or before end expands the interval; insertion immediately after
        end leaves it unchanged. Deletion removes the deleted original cells from a range and maps the surviving
        first/last cells to their new coordinates, shrinking a partially deleted range. If a direct reference's target
        or every cell of a referenced range is deleted, the affected stored formula becomes =#REF! and its displayed
        value is #REF!. These rules apply independently to row and column intervals. Pivot source ranges follow the same
        interval mapping, while deletion of a selected header retains an unavailable field rather than selecting a
        different current column. Recreating a deleted header identity is outside this version's scored input domain.
    scenarios: []
    children:
    - id: REQ-2.2.1
      name: Insert and Delete Rows
      description:
        text: |-
          Users insert blank rows above or below a target row, or delete the target row, through the row-number menu in the current active worksheet. The row-number menu provides "Insert 1 row above", "Insert 1 row below", and "Delete row". Inserting above row r creates a blank row at r and shifts the former row r and later rows down; inserting below row r creates a blank row at r+1, leaves row r in place, and shifts the former row r+1 and later rows down. Stored records, validation rules and references follow the affected cells; on deletion, subsequent rows shift upward and rules on the target row are removed. Affected formulas display the adjusted stored formulas and correct results, and direct references whose target cell was deleted display #REF!; filters continue to apply to the original data region. If a shifted 0-to-100 numeric validation rule rejects an out-of-range value, the page displays "Please enter a number between 0 and 100". If the change overlaps a pivot-table source range, the existing pivot result remains unchanged until "Refresh pivot table" is clicked, after which it is recomputed using the adjusted range. If the operation fails, an error is displayed and the grid immediately and after refresh retains the pre-operation structure; partial row movement is not allowed.

          The active worksheet uses grid role with accessible name Worksheet grid and aria-multiselectable=true. Cells use gridcell role and their coordinates as names; the selected cell and cells in a selected rectangular range expose aria-selected=true, and other cells expose aria-selected=false. Worksheet tabs use tab role and expose their active state through aria-selected.

          The current workbook retains its identity when revisiting or refreshing its visible state. Operations apply to the current active worksheet or workbook as stated and must not modify unrelated workbooks or worksheets.

          Row headers use rowheader role and decimal row numbers as names; column headers use columnheader role and column letters as names. Right-clicking a header opens menuitem commands. Structural changes keep values, formulas, validation, filter views and pivot refresh references consistent.
        image:
        - id: IMG-MANAGE-ROWS
          reference: reference/manage-rows.png
          page: workbook_editor
      scenarios:
      - id: SCN-REQ-2.2.1-01
        name: REQ-2.2.1 - Insert and Delete Rows - Scenario 1
        steps:
        - id: STEP-REQ-2.2.1-01-01
          Given: A1:B3 contains Item/Amount, Alpha/10, Beta/20. D1 is =SUM(B2:B3), E1 is =SUM($B$3:$B$3), and F1 is
            =SUM(B2:B2), with results 30, 20 and 10.
          When: The user inserts one row above row 3 and refreshes.
          Then: Row 3 is blank and Beta/20 moves to row 4 while Alpha/10 stays in row 2. D1 becomes =SUM(B2:B4), E1
            becomes =SUM($B$4:$B$4), and F1 retains =SUM(B2:B2); their results remain 30, 20 and 10. Values and stored
            expressions persist after refresh.
          references:
          - \ref[requirement](REQ-1.1.1)
          - \ref[image](IMG-MANAGE-ROWS)
      - id: SCN-REQ-2.2.1-02
        name: REQ-2.2.1 - Insert and Delete Rows - Scenario 2
        steps:
        - id: STEP-REQ-2.2.1-02-01
          Given: A2:B4 contains Alpha/10, Remove me/20, Beta/30. C1 is =B3, D1 is =SUM(B2:B4), and E1 is =SUM(B3:B3),
            with results 20, 60 and 20.
          When: The user deletes row 3 and refreshes.
          Then: "Beta/30 moves to A3:B3 and A4:B4 becomes blank, while Alpha/10 remains in row 2. C1 and E1 display
            #REF! with stored expression =#REF!; D1 becomes =SUM(B2:B3) and displays 40. The cells and stored
            expressions persist after refresh."
          references:
          - \ref[requirement](REQ-1.1.1)
          - \ref[image](IMG-MANAGE-ROWS)
      - id: SCN-REQ-2.2.1-03
        name: REQ-2.2.1 - Insert and Delete Rows - Scenario 3
        steps:
        - id: STEP-REQ-2.2.1-03-01
          Given: A1 and A2 contain Alpha and Beta.
          When: The user inserts one row below row 1 and refreshes.
          Then: A2 is blank and Beta moves to A3.
          references:
          - \ref[requirement](REQ-1.1.1)
          - \ref[image](IMG-MANAGE-ROWS)
      - id: SCN-REQ-2.2.1-04
        name: REQ-2.2.1 - Insert and Delete Rows - Scenario 4
        steps:
        - id: STEP-REQ-2.2.1-04-01
          Given: A1 is 2 and B1 is =A1*2.
          When: The user inserts one row above row 1 and selects B2.
          Then: 2 moves to A2, B2 evaluates to 4, and its formula bar is =A2*2 before and after refresh.
          references:
          - \ref[requirement](REQ-1.1.1)
          - \ref[image](IMG-MANAGE-ROWS)
      - id: SCN-REQ-2.2.1-05
        name: REQ-2.2.1 - Insert and Delete Rows - Scenario 5
        steps:
        - id: STEP-REQ-2.2.1-05-01
          Given: A2 is 50 with number validation from 0 through 100.
          When: The user inserts a row above row 2, attempts 120 in A3, then enters 120 in A2 and refreshes.
          Then: A3 rejects 120 with the range error and remains 50; A2 accepts 120 and both values persist.
          references:
          - \ref[requirement](REQ-1.1.1)
          - \ref[image](IMG-MANAGE-ROWS)
      children: []
    - id: REQ-2.2.2
      name: Insert and Delete Columns
      description:
        text: |-
          Users insert a blank column to the left or right of a target column, or delete the target column, through the column-header menu in the current active worksheet. The column-header menu provides "Insert 1 column left", "Insert 1 column right", and "Delete column". Inserting left of a column creates a blank column at its former coordinate and shifts that column and later columns right; inserting right leaves the target column in place, creates a blank column immediately after it, and shifts only the subsequent columns right. Stored records, validation rules and references follow the affected cells; on deletion, subsequent columns shift left and rules on the target column are removed. Data outside the deleted column is preserved; affected formulas display the adjusted stored formulas and correct results, while direct references that cannot be preserved display #REF!; filters continue to apply to the adjusted region. If a shifted 0-to-100 numeric validation rule rejects an out-of-range value, the page displays "Please enter a number between 0 and 100". After pivot-table source columns move, existing results remain unchanged until "Refresh pivot table" is clicked, after which the moved fields are used. If a selected header is deleted, refreshing or opening the pivot table editor displays a visible error requiring the field to be reselected and preserves the last successful result. If the operation fails, an error is shown and the grid retains the pre-operation structure immediately and after refresh.

          The active worksheet uses grid role with accessible name Worksheet grid and aria-multiselectable=true. Cells use gridcell role and their coordinates as names; the selected cell and cells in a selected rectangular range expose aria-selected=true, and other cells expose aria-selected=false. Worksheet tabs use tab role and expose their active state through aria-selected.

          The current workbook retains its identity when revisiting or refreshing its visible state. Operations apply to the current active worksheet or workbook as stated and must not modify unrelated workbooks or worksheets.

          Row headers use rowheader role and decimal row numbers as names; column headers use columnheader role and column letters as names. Right-clicking a header opens menuitem commands. Structural changes keep values, formulas, validation, filter views and pivot refresh references consistent.
        image:
        - id: IMG-MANAGE-COLUMNS
          reference: reference/manage-columns.png
          page: workbook_editor
      scenarios:
      - id: SCN-REQ-2.2.2-01
        name: REQ-2.2.2 - Insert and Delete Columns - Scenario 1
        steps:
        - id: STEP-REQ-2.2.2-01-01
          Given: A1:C1 contains Alpha, Beta, Gamma and A2:C2 contains 1, 2, 3. A4 is =SUM(A2:C2), A5 is =SUM($B$2:$C$2),
            and A6 is =SUM(A2:A2), with results 6, 5 and 1.
          When: The user inserts one column left of B and refreshes.
          Then: Column B is blank; Beta/2 moves to C and Gamma/3 moves to D while Alpha/1 remains in A. A4 becomes
            =SUM(A2:D2), A5 becomes =SUM($C$2:$D$2), and A6 retains =SUM(A2:A2), with results 6, 5 and 1 before and
            after refresh.
          references:
          - \ref[requirement](REQ-1.1.1)
          - \ref[image](IMG-MANAGE-COLUMNS)
      - id: SCN-REQ-2.2.2-02
        name: REQ-2.2.2 - Insert and Delete Columns - Scenario 2
        steps:
        - id: STEP-REQ-2.2.2-02-01
          Given: A1:C2 contains Unit price/Quantity/Total and 10/2/=A2*B2. A3:C3 contains 1, 2, 3. A4 is =SUM(A3:C3)
            with result 6 and A5 is =SUM(B3:B3) with result 2.
          When: The user deletes column B and refreshes.
          Then: "Total moves to column B; B2 displays #REF! with stored expression =#REF!. C1:C3 becomes blank, A3:B3
            is 1/3, A4 becomes =SUM(A3:B3) and displays 4, and A5 displays #REF! with stored expression =#REF!. Values
            and stored expressions persist after refresh."
          references:
          - \ref[requirement](REQ-1.1.1)
          - \ref[image](IMG-MANAGE-COLUMNS)
      - id: SCN-REQ-2.2.2-03
        name: REQ-2.2.2 - Insert and Delete Columns - Scenario 3
        steps:
        - id: STEP-REQ-2.2.2-03-01
          Given: A1 and B1 contain Alpha and Beta.
          When: The user inserts one column right of A and refreshes.
          Then: B1 is blank and Beta moves to C1.
          references:
          - \ref[requirement](REQ-1.1.1)
          - \ref[image](IMG-MANAGE-COLUMNS)
      - id: SCN-REQ-2.2.2-04
        name: REQ-2.2.2 - Insert and Delete Columns - Scenario 4
        steps:
        - id: STEP-REQ-2.2.2-04-01
          Given: A1 is 2 and B1 is =A1*2.
          When: The user inserts one column left of A and selects C1.
          Then: 2 moves to B1, C1 evaluates to 4, and its formula bar is =B1*2 before and after refresh.
          references:
          - \ref[requirement](REQ-1.1.1)
          - \ref[image](IMG-MANAGE-COLUMNS)
      - id: SCN-REQ-2.2.2-05
        name: REQ-2.2.2 - Insert and Delete Columns - Scenario 5
        steps:
        - id: STEP-REQ-2.2.2-05-01
          Given: B1 is 50 with number validation from 0 through 100.
          When: The user inserts a column left of B, attempts 120 in C1, then enters 120 in B1 and refreshes.
          Then: C1 rejects 120 and remains 50; B1 accepts 120 and both values persist.
          references:
          - \ref[requirement](REQ-1.1.1)
          - \ref[image](IMG-MANAGE-COLUMNS)
      children: []
  - id: REQ-3.1
    name: Direct Data Entry
    description:
      text: |-
        Supports entering data through the current worksheet grid, the text box labeled "Formula bar", or the external clipboard. The grid, formula bar, and selection state must show consistent content for the same cell; ordinary values and stored formulas persist after refresh. Double-clicking a grid cell displays an inline text box with the accessible name "Edit <cell coordinate>".

        For cell text, formulas and table data entered through UI: Entered through the grid, formula bar, clipboard paste or successful CSV import into the current worksheet. Coordinates and values are supplied by the caller; rejected edits do not create cell data.
    scenarios: []
    children:
    - id: REQ-3.1.1
      name: Edit a Cell Through the Grid or Formula Bar
      description:
        text: |-
          After selecting a cell in the current active worksheet, users can modify its content directly in the grid or formula bar. Cells support text, numbers, boolean-like values, date text, and formulas beginning with an equals sign. Pressing Enter or clicking another cell commits the change; pressing Escape cancels an uncommitted change. Ordinary cells show the same input in the grid and formula bar; formula cells show the calculated result in the grid and the currently stored formula in the formula bar. After a source value is committed, directly and indirectly dependent formulas update their results. Values, stored formulas, and results persist after refresh. If a commit fails, an error is displayed, the grid and formula bar continue to show the last successful value or formula, and dependent results remain unchanged.

          The active worksheet uses grid role with accessible name Worksheet grid and aria-multiselectable=true. Cells use gridcell role and their coordinates as names; the selected cell and cells in a selected rectangular range expose aria-selected=true, and other cells expose aria-selected=false. Worksheet tabs use tab role and expose their active state through aria-selected.

          The current workbook retains its identity when revisiting or refreshing its visible state. Operations apply to the current active worksheet or workbook as stated and must not modify unrelated workbooks or worksheets.

          Double-clicking a grid cell opens an inline textbox named Edit <cell coordinate>. The textbox labeled Formula bar always shows the selected cell ordinary value or stored formula.
      scenarios:
      - id: SCN-REQ-3.1.1-01
        name: REQ-3.1.1 - Edit a Cell Through the Grid or Formula Bar - Scenario 1
        steps:
        - id: STEP-REQ-3.1.1-01-01
          Given: A1 is 2 and B1 contains =A1*2.
          When: The user edits A1 through the formula bar from 2 to 3, selects both cells, and refreshes.
          Then: A1 is 3, B1 recalculates to 6, and B1's formula bar remains =A1*2.
          references:
          - \ref[requirement](REQ-1.1.1)
      - id: SCN-REQ-3.1.1-02
        name: REQ-3.1.1 - Edit a Cell Through the Grid or Formula Bar - Scenario 2
        steps:
        - id: STEP-REQ-3.1.1-02-01
          Given: A1 contains Saved value.
          When: The user opens the inline editor, types Unsaved value, presses Escape, and refreshes.
          Then: A1 remains Saved value, the inline editor closes, and Unsaved value is absent.
          references:
          - \ref[requirement](REQ-1.1.1)
      - id: SCN-REQ-3.1.1-03
        name: REQ-3.1.1 - Edit a Cell Through the Grid or Formula Bar - Scenario 3
        steps:
        - id: STEP-REQ-3.1.1-03-01
          Given: A blank workbook is open.
          When: Through the grid, enter Plain text in A1, 42 in A2, TRUE in A3, 2026-08-06 in A4, and =A2*2 in A5,
            committing each edit. Then enter Committed by selection change in B1 and click B2 to commit that edit.
            Refresh the workbook.
          Then: A1:A4 display their respective ordinary inputs unchanged, and A5 displays 84 with stored formula =A2*2.
            B1 displays Committed by selection change and the inline editor has closed. Selecting each cell shows its
            own stored input in the Formula bar. These values and the formula persist after refresh.
          references:
          - \ref[requirement](REQ-1.1.1)
      - id: SCN-REQ-3.1.1-04
        name: REQ-3.1.1 - Edit a Cell Through the Grid or Formula Bar - Scenario 4
        steps:
        - id: STEP-REQ-3.1.1-04-01
          Given: A blank workbook is open.
          When: The user enters 7 in C3 and =C3*3 in D4, then selects D4 and refreshes.
          Then: C3 is 7, D4 is 21, and D4's formula bar contains =C3*3 before and after refresh.
          references:
          - \ref[requirement](REQ-1.1.1)
      children: []
    - id: REQ-3.1.2
      name: Paste Two-Dimensional Table Data
      description:
        text: |-
          Users paste text containing tab-separated columns and newline-separated rows into a starting cell in the current active worksheet. The system applies the entire rectangle, preserves empty fields, and overwrites only the target rectangle; formulas within the target are replaced by the new content and related formulas display recalculated results. The full paste either updates every cell in the rectangle and persists after refresh, or displays an error while all target cells retain their original values; when a 0-to-100 numeric validation rule rejects the paste, that error is "Please enter a number between 0 and 100". Silently dropping only some values is not allowed. The grid context menu provides a command using the ARIA menuitem role with the accessible name "Paste", and Ctrl+V pastes the same external clipboard content.

          The active worksheet uses grid role with accessible name Worksheet grid and aria-multiselectable=true. Cells use gridcell role and their coordinates as names; the selected cell and cells in a selected rectangular range expose aria-selected=true, and other cells expose aria-selected=false. Worksheet tabs use tab role and expose their active state through aria-selected.

          The current workbook retains its identity when revisiting or refreshing its visible state. Operations apply to the current active worksheet or workbook as stated and must not modify unrelated workbooks or worksheets.
      scenarios:
      - id: SCN-REQ-3.1.2-01
        name: REQ-3.1.2 - Paste Two-Dimensional Table Data - Scenario 1
        steps:
        - id: STEP-REQ-3.1.2-01-01
          Given: A1 is Outside and E4 is Keep.
          When: The user pastes Alpha/[blank]/3 and Beta/Middle/4 starting at B2 and refreshes.
          Then: The two-dimensional paste occupies B2:D3 with the blank C2 preserved; A1 and E4 are unchanged and
            all values persist.
          references:
          - \ref[requirement](REQ-3.1.1)
      - id: SCN-REQ-3.1.2-02
        name: REQ-3.1.2 - Paste Two-Dimensional Table Data - Scenario 2
        steps:
        - id: STEP-REQ-3.1.2-02-01
          Given: A1 and A2 contain 10 and 20 with number validation 0 through 100.
          When: The user pastes 50 and 120 over A1:A2.
          Then: The range error is shown and the paste is rejected atomically; A1 and A2 remain 10 and 20 after
            refresh.
          references:
          - \ref[requirement](REQ-3.1.1)
      - id: SCN-REQ-3.1.2-03
        name: REQ-3.1.2 - Paste Two-Dimensional Table Data - Scenario 3
        steps:
        - id: STEP-REQ-3.1.2-03-01
          Given: A1 is 2, B1 is =A1*2, and C1 is =B1+1.
          When: The user pastes 3 and 5 over A1:B1 using the cell context menu.
          Then: A1 and B1 become 3 and 5, C1 recalculates to 6, and C1's formula remains =B1+1 after refresh.
          references:
          - \ref[requirement](REQ-3.1.1)
      - id: SCN-REQ-3.1.2-04
        name: REQ-3.1.2 - Paste Two-Dimensional Table Data - Scenario 4
        steps:
        - id: STEP-REQ-3.1.2-04-01
          Given: E4 is Keep.
          When: The user pastes Alpha/[blank]/Gamma starting at A1 and refreshes.
          Then: A1 is Alpha, B1 is blank, C1 is Gamma, and E4 remains Keep.
          references:
          - \ref[requirement](REQ-3.1.1)
      - id: SCN-REQ-3.1.2-05
        name: REQ-3.1.2 - Paste Two-Dimensional Table Data - Scenario 5
        steps:
        - id: STEP-REQ-3.1.2-05-01
          Given: A1 is Outside.
          When: The user pastes a 2x2 table One/Two/Three/Four starting at C3 and refreshes.
          Then: C3:D4 contains the four values and A1 remains Outside.
          references:
          - \ref[requirement](REQ-3.1.1)
      children: []
    - id: REQ-3.1.3
      name: Select a Rectangular Cell Range
      description:
        text: |-
          Users can click to select a single cell or drag from one corner of a rectangular region to the diagonally opposite cell to select a contiguous rectangle. The active worksheet must visibly indicate the complete selection; the grid exposes aria-multiselectable="true"; every gridcell inside the rectangle exposes aria-selected="true", while every gridcell outside it exposes aria-selected="false". Subsequent range operations use exactly this rectangle and must not implicitly expand to adjacent existing data. Selecting another cell or range replaces the previous selection and updates the ARIA state accordingly. Each worksheet must persist the complete rectangle from its most recent successful selection, not just its top-left corner: after refreshing or reopening the workbook and returning to that active worksheet, aria-selected states inside and outside the rectangle must exactly match the saved state; switching to another worksheet must not overwrite the original worksheet’s selection.

          The active worksheet uses grid role with accessible name Worksheet grid and aria-multiselectable=true. Cells use gridcell role and their coordinates as names; the selected cell and cells in a selected rectangular range expose aria-selected=true, and other cells expose aria-selected=false. Worksheet tabs use tab role and expose their active state through aria-selected.

          The current workbook retains its identity when revisiting or refreshing its visible state. Operations apply to the current active worksheet or workbook as stated and must not modify unrelated workbooks or worksheets.
      scenarios:
      - id: SCN-REQ-3.1.3-01
        name: REQ-3.1.3 - Select a Rectangular Cell Range - Scenario 1
        steps:
        - id: STEP-REQ-3.1.3-01-01
          Given: A blank workbook is open.
          When: The user selects A1:B3 and then clicks C1.
          Then: The worksheet grid is multiselectable; exactly A1:B3 are aria-selected before the click, then only
            C1 is selected.
          references:
          - \ref[requirement](REQ-1.1.1)
      - id: SCN-REQ-3.1.3-02
        name: REQ-3.1.3 - Select a Rectangular Cell Range - Scenario 2
        steps:
        - id: STEP-REQ-3.1.3-02-01
          Given: A blank workbook is open.
          When: The user selects A1:B3, refreshes, clicks C1, and refreshes again.
          Then: A1:B3 remain selected after the first refresh; after selecting C1 and refreshing, C1 is selected
            and A1:B3 are unselected.
          references:
          - \ref[requirement](REQ-1.1.1)
      children: []
  - id: REQ-3.2
    name: Range Transfer and Operation Recovery
    description:
      text: Supports transferring data between ranges in the current active worksheet and using undo and redo to
        restore grid values, formulas, rule ranges, and row/column structure. The visible state after each undo
        or redo persists after refresh.
    scenarios: []
    children:
    - id: REQ-3.2.1
      name: Copy, Cut, and Paste Cell Ranges
      description:
        text: |-
          Users select a rectangular range by dragging from one corner to another in the current active worksheet, then copy or cut it and select a target location to paste; only operations within the same worksheet are supported. Copying leaves the source content unchanged. Starting a cut does not clear the source. On successful cut-and-paste, each destination cell contains the content of its corresponding pre-paste source cell, including when the rectangles overlap, and only source cells outside the destination become empty. Source, destination and required dependent updates form one committed result. A rejected paste leaves the complete prior state unchanged. A partially completed move must not be exposed as a committed result. Values and formulas preserve their two-dimensional layout; when formulas are copied, relative references adjust according to the target offset while absolute references remain unchanged, and the formula bar displays the adjusted stored formula. The source range, target range, and affected formulas must either all update and persist after refresh or all remain in their original state; when a target 0-to-100 numeric validation rule rejects the operation, the page displays "Please enter a number between 0 and 100". Cells outside the source and destination retain unrelated stored data and rules. Formula references to moved source cells may change outside those rectangles, and directly or indirectly dependent displayed results must recalculate; these are required effects of a cut, not unrelated edits. Cut reference mapping, overlapping destinations and destination validation follow REQ-6.1 and REQ-6.2. Copy reference adjustment remains distinct from cut reference mapping.

          The active worksheet uses grid role with accessible name Worksheet grid and aria-multiselectable=true. Cells use gridcell role and their coordinates as names; the selected cell and cells in a selected rectangular range expose aria-selected=true, and other cells expose aria-selected=false. Worksheet tabs use tab role and expose their active state through aria-selected.

          The current workbook retains its identity when revisiting or refreshing its visible state. Operations apply to the current active worksheet or workbook as stated and must not modify unrelated workbooks or worksheets.
        image:
        - id: IMG-COPY-PASTE-RANGE
          reference: reference/copy-paste-range.png
          page: workbook_editor
      scenarios:
      - id: SCN-REQ-3.2.1-01
        name: REQ-3.2.1 - Copy, Cut, and Paste Cell Ranges - Scenario 1
        steps:
        - id: STEP-REQ-3.2.1-01-01
          Given: A1:B2 contains 1/2 and 3/=A1+$B$1, and G1 is Keep.
          When: The user copies A1:B2 to D1:E2 and refreshes.
          Then: The copied range displays the same values, E2's formula bar is =D1+$B$1, the source is unchanged,
            and G1 remains Keep.
          references:
          - \ref[requirement](REQ-3.1.1)
          - \ref[requirement](REQ-3.1.3)
          - \ref[image](IMG-COPY-PASTE-RANGE)
      - id: SCN-REQ-3.2.1-02
        name: REQ-3.2.1 - Copy, Cut, and Paste Cell Ranges - Scenario 2
        steps:
        - id: STEP-REQ-3.2.1-02-01
          Given: A1:B2 contains A/B and C/D, and G1 is Keep.
          When: The user cuts A1:B2 and pastes at D1, then refreshes.
          Then: A1:B2 are blank, D1:E2 contain A/B/C/D, and G1 remains Keep.
          references:
          - \ref[requirement](REQ-3.1.1)
          - \ref[requirement](REQ-3.1.3)
          - \ref[image](IMG-COPY-PASTE-RANGE)
      - id: SCN-REQ-3.2.1-03
        name: REQ-3.2.1 - Copy, Cut, and Paste Cell Ranges - Scenario 3
        steps:
        - id: STEP-REQ-3.2.1-03-01
          Given: A1:A2 contain 10 and 120; D1:D2 contain 1 and 2 with validation 0 through 100.
          When: The user cuts A1:A2 and pastes into D1.
          Then: The validation error is shown and both source and destination ranges retain their original values
            after refresh.
          references:
          - \ref[requirement](REQ-3.1.1)
          - \ref[requirement](REQ-3.1.3)
          - \ref[image](IMG-COPY-PASTE-RANGE)
      - id: SCN-REQ-3.2.1-04
        name: REQ-3.2.1 - Copy, Cut, and Paste Cell Ranges - Scenario 4
        steps:
        - id: STEP-REQ-3.2.1-04-01
          Given: A1 is Copied text and B1 is Copied second cell.
          When: The user copies A1 and pastes it at D4, then refreshes.
          Then: A1 and D4 both display Copied text.
          references:
          - \ref[requirement](REQ-3.1.1)
          - \ref[requirement](REQ-3.1.3)
          - \ref[image](IMG-COPY-PASTE-RANGE)
      children: []
    - id: REQ-3.2.2
      name: Undo and Redo Recent Operations
      description:
        text: |-
          Users can undo recent cell edits, bulk pastes, range moves, and row/column structure changes in the current workbook session. The toolbar provides buttons with the accessible names "Undo" and "Redo"; Ctrl+Z and Ctrl+Y perform the same operations. Undo restores the grid values, stored formulas, row/column structure, rule ranges, pivot-result validity, and calculation results from before the operation; consecutive undo operations restore changes in reverse order, and redo reapplies the complete operation that was just undone. Undo in one workbook must not modify another workbook. The state after each undo or redo persists after refresh; the history itself only needs to exist within the current session and may be empty after reopening. If a new modification is made after an undo, the "Redo" button becomes disabled and Ctrl+Y cannot restore the old branch.

          The active worksheet uses grid role with accessible name Worksheet grid and aria-multiselectable=true. Cells use gridcell role and their coordinates as names; the selected cell and cells in a selected rectangular range expose aria-selected=true, and other cells expose aria-selected=false. Worksheet tabs use tab role and expose their active state through aria-selected.

          The current workbook retains its identity when revisiting or refreshing its visible state. Operations apply to the current active worksheet or workbook as stated and must not modify unrelated workbooks or worksheets.

          Each accepted cell edit, rectangular paste or move, or single row/column insertion or deletion is one history entry, including its required reference and calculation updates. Selecting cells, switching worksheets and copying do not themselves add data-history entries. A validation refusal or Escape cancellation adds no entry and does not discard a valid redo branch. Only a subsequent successful data modification replaces that branch. Undo and Redo act on the workbook and worksheet that owned the recorded operation, not a different workbook or the currently selected cell.
      scenarios:
      - id: SCN-REQ-3.2.2-01
        name: REQ-3.2.2 - Undo and Redo Recent Operations - Scenario 1
        steps:
        - id: STEP-REQ-3.2.2-01-01
          Given: A blank workbook is open.
          When: The user enters a runtime-unique value in A1, clicks Undo, clicks Redo, and refreshes.
          Then: Undo clears A1, Redo restores it, and the restored value persists.
          references:
          - \ref[requirement](REQ-2.2.1)
          - \ref[requirement](REQ-2.2.2)
          - \ref[requirement](REQ-3.1.1)
          - \ref[requirement](REQ-3.1.2)
          - \ref[requirement](REQ-3.2.1)
      - id: SCN-REQ-3.2.2-02
        name: REQ-3.2.2 - Undo and Redo Recent Operations - Scenario 2
        steps:
        - id: STEP-REQ-3.2.2-02-01
          Given: A blank workbook is open.
          When: Enter a runtime-unique old value in A1 and undo it. Open the inline editor, enter a different unsaved
            value, and press Escape. Redo the old edit and Undo it again. Enter a distinct runtime-unique new value,
            attempt Redo and refresh.
          Then: Escape closes the editor, leaves A1 and its stored input blank, and preserves the enabled redo branch.
            Redo restores exactly the old value and Undo clears it again. The successful new edit then disables Redo;
            toolbar and Ctrl+Y cannot restore the old branch, and the new value persists after refresh.
          references:
          - \ref[requirement](REQ-2.2.1)
          - \ref[requirement](REQ-2.2.2)
          - \ref[requirement](REQ-3.1.1)
          - \ref[requirement](REQ-3.1.2)
          - \ref[requirement](REQ-3.2.1)
      - id: SCN-REQ-3.2.2-03
        name: REQ-3.2.2 - Undo and Redo Recent Operations - Scenario 3
        steps:
        - id: STEP-REQ-3.2.2-03-01
          Given: A1 is 2, B1 is =A1*2, and A1 is then changed to 3.
          When: The user undoes and redoes the last edit, selecting B1 each time.
          Then: Undo restores A1=2/B1=4; Redo restores A1=3/B1=6; B1's formula remains =A1*2 after refresh.
          references:
          - \ref[requirement](REQ-2.2.1)
          - \ref[requirement](REQ-2.2.2)
          - \ref[requirement](REQ-3.1.1)
          - \ref[requirement](REQ-3.1.2)
          - \ref[requirement](REQ-3.2.1)
      - id: SCN-REQ-3.2.2-04
        name: REQ-3.2.2 - Undo and Redo Recent Operations - Scenario 4
        steps:
        - id: STEP-REQ-3.2.2-04-01
          Given: A blank workbook is open.
          When: The user pastes a 2x2 table, undoes the paste, redoes it, and refreshes.
          Then: Undo clears A1:B2; Redo restores A/B/C/D and the restored table persists.
          references:
          - \ref[requirement](REQ-2.2.1)
          - \ref[requirement](REQ-2.2.2)
          - \ref[requirement](REQ-3.1.1)
          - \ref[requirement](REQ-3.1.2)
          - \ref[requirement](REQ-3.2.1)
      - id: SCN-REQ-3.2.2-05
        name: REQ-3.2.2 - Undo and Redo Recent Operations - Scenario 5
        steps:
        - id: STEP-REQ-3.2.2-05-01
          Given: A1 is Left and B1 is Right.
          When: The user cuts A1:B1 to D1:E1, undoes, redoes, and refreshes.
          Then: Undo restores the source and clears the destination; Redo clears the source and restores Left/Right
            at D1:E1.
          references:
          - \ref[requirement](REQ-2.2.1)
          - \ref[requirement](REQ-2.2.2)
          - \ref[requirement](REQ-3.1.1)
          - \ref[requirement](REQ-3.1.2)
          - \ref[requirement](REQ-3.2.1)
      - id: SCN-REQ-3.2.2-06
        name: REQ-3.2.2 - Undo and Redo Recent Operations - Scenario 6
        steps:
        - id: STEP-REQ-3.2.2-06-01
          Given: A1 is Keep with dropdown validation Keep/Other.
          When: The user inserts a row above and a column left, undoes both operations, redoes both, and refreshes.
          Then: The value and validation move from A1 to B2 through the operations and remain there after refresh.
          references:
          - \ref[requirement](REQ-2.2.1)
          - \ref[requirement](REQ-2.2.2)
          - \ref[requirement](REQ-3.1.1)
          - \ref[requirement](REQ-3.1.2)
          - \ref[requirement](REQ-3.2.1)
      - id: SCN-REQ-3.2.2-07
        name: REQ-3.2.2 - Undo and Redo Recent Operations - Scenario 7
        steps:
        - id: STEP-REQ-3.2.2-07-01
          Given: One runtime-named workbook contains a first unique value in A1.
          When: The user creates and runtime-names a second workbook, enters a second unique value, clicks Undo, and returns home.
          Then: Both runtime-named workbook links remain visible. Undo clears only the second
            workbook's A1 and that blank value survives refresh and reopening; the first workbook
            retains its original A1 value. Other previously created workbooks are unaffected.
          references:
          - \ref[requirement](REQ-2.2.1)
          - \ref[requirement](REQ-2.2.2)
          - \ref[requirement](REQ-3.1.1)
          - \ref[requirement](REQ-3.1.2)
          - \ref[requirement](REQ-3.2.1)
      children: []
  - id: REQ-4.1
    name: Formula Input and Functions
    description:
      text: Supports entering basic expressions and aggregate functions through the grid and "Formula bar" from
        REQ-3.1.1 and copying formulas through REQ-3.2.1. The formula bar always displays the stored formula, the grid
        displays results consistent with the current source data, and both persist after refresh.
    scenarios: []
    children:
    - id: REQ-4.1.1
      name: Calculate Basic Expressions and Aggregate Functions
      description:
        text: |-
          Users enter formulas beginning with an equals sign through the grid or formula bar in REQ-3.1.1. Formulas must support at least numeric constants, parentheses, addition, subtraction, multiplication, division, A1-style references within the same worksheet, and SUM, AVERAGE, COUNT, MIN, and MAX over contiguous ranges; cross-worksheet references are not required. The grid displays results calculated from the current source data, and when a formula cell is selected the formula bar displays the currently stored expression; both persist after refresh. Function names are case-insensitive; aggregate functions ignore empty cells, COUNT counts only numeric cells, and SUM/AVERAGE/MIN/MAX use only numeric cells and do not treat blanks as zero.

          The active worksheet uses grid role with accessible name Worksheet grid and aria-multiselectable=true. Cells use gridcell role and their coordinates as names; the selected cell and cells in a selected rectangular range expose aria-selected=true, and other cells expose aria-selected=false. Worksheet tabs use tab role and expose their active state through aria-selected.

          The current workbook retains its identity when revisiting or refreshing its visible state. Operations apply to the current active worksheet or workbook as stated and must not modify unrelated workbooks or worksheets.

          The Formula bar displays the stored formula while the grid displays its current calculated result. Edits, pastes, moves and row/column changes update dependent references and results; an erroneous formula does not corrupt unrelated cells.
        image:
        - id: IMG-BASIC-FORMULAS
          reference: reference/basic-formulas.png
          page: workbook_editor
      scenarios:
      - id: SCN-REQ-4.1.1-01
        name: REQ-4.1.1 - Calculate Basic Expressions and Aggregate Functions - Scenario 1
        steps:
        - id: STEP-REQ-4.1.1-01-01
          Given: A1 is 3 and B1 is 4.
          When: The user enters =(A1+B1)*2 in C1 and refreshes.
          Then: C1 displays 14 and its formula bar contains the entered expression before and after refresh.
          references:
          - \ref[requirement](REQ-3.1.1)
          - \ref[image](IMG-BASIC-FORMULAS)
      - id: SCN-REQ-4.1.1-02
        name: REQ-4.1.1 - Calculate Basic Expressions and Aggregate Functions - Scenario 2
        steps:
        - id: STEP-REQ-4.1.1-02-01
          Given: B2=2, B4=4 and B6=6; B3, B5, B7 and B10 are empty; B8 is not numeric and B9 is TRUE. F2 is empty and F3
            is not numeric. D2:D6 and H2:H6 are empty.
          When: Enter =sum(B2:B10), =AVERAGE(B2:B10), =COUNT(B2:B10), =MIN(B2:B10), =MAX(B2:B10) in D2:D6. Enter the
            corresponding five functions over F2:F3 in H2:H6, then refresh.
          Then: "D2:D6 display 12, 4, 3, 2 and 6. H2:H6 display 0, #DIV/0!, 0, 0 and 0. Selecting every output shows
            its own stored expression, including lowercase sum in D2; all results and expressions persist after
            refresh."
          references:
          - \ref[requirement](REQ-3.1.1)
          - \ref[image](IMG-BASIC-FORMULAS)
      - id: SCN-REQ-4.1.1-03
        name: REQ-4.1.1 - Calculate Basic Expressions and Aggregate Functions - Scenario 3
        steps:
        - id: STEP-REQ-4.1.1-03-01
          Given: A1 is 9 and B1 is 3.
          When: The user enters =A1-B1, =A1/B1, =10-3*2, and =42 in C1:C4.
          Then: C1:C4 display 6, 3, 4, and 42 with the stored formula expressions preserved after refresh.
          references:
          - \ref[requirement](REQ-3.1.1)
          - \ref[image](IMG-BASIC-FORMULAS)
      - id: SCN-REQ-4.1.1-04
        name: REQ-4.1.1 - Calculate Basic Expressions and Aggregate Functions - Scenario 4
        steps:
        - id: STEP-REQ-4.1.1-04-01
          Given: A1, B1, and C1 are 8, 4, and 2.
          When: The user enters =(A1+B1)*C1 in D1 and =A1-B1/2 in D2, then refreshes.
          Then: D1 is 24 and D2 is 6.
          references:
          - \ref[requirement](REQ-3.1.1)
          - \ref[image](IMG-BASIC-FORMULAS)
      - id: SCN-REQ-4.1.1-05
        name: REQ-4.1.1 - Calculate Basic Expressions and Aggregate Functions - Scenario 5
        steps:
        - id: STEP-REQ-4.1.1-05-01
          Given: A1, B1, and C1 are 5, 6, and 4.
          When: The user enters =A1*B1+C1 in D1 and =(A1+B1)/C1 in D2, then refreshes.
          Then: D1 is 34 and D2 is 2.75.
          references:
          - \ref[requirement](REQ-3.1.1)
          - \ref[image](IMG-BASIC-FORMULAS)
      children: []
    - id: REQ-4.1.2
      name: Copy Formulas and Adjust Relative References
      description:
        text: |-
          When a formula cell is copied through REQ-3.2.1 to another location in the same worksheet, relative row and column references in the target formula bar change according to the target offset while absolute references remain unchanged; the source formula and result remain unchanged, the target grid displays the result based on the new references, and the state persists after refresh. If the offset moves a relative reference outside the worksheet bounds, the target formula bar displays =#REF! and the grid displays #REF!.

          The active worksheet uses grid role with accessible name Worksheet grid and aria-multiselectable=true. Cells use gridcell role and their coordinates as names; the selected cell and cells in a selected rectangular range expose aria-selected=true, and other cells expose aria-selected=false. Worksheet tabs use tab role and expose their active state through aria-selected.

          The current workbook retains its identity when revisiting or refreshing its visible state. Operations apply to the current active worksheet or workbook as stated and must not modify unrelated workbooks or worksheets.

          The Formula bar displays the stored formula while the grid displays its current calculated result. Edits, pastes, moves and row/column changes update dependent references and results; an erroneous formula does not corrupt unrelated cells.
      scenarios:
      - id: SCN-REQ-4.1.2-01
        name: REQ-4.1.2 - Copy Formulas and Adjust Relative References - Scenario 1
        steps:
        - id: STEP-REQ-4.1.2-01-01
          Given: A1 is 1, B1 is 2, A2 is 10, and C1 is =A1+$B$1.
          When: The user copies C1 to C2 and refreshes.
          Then: C1 is 3 with formula =A1+$B$1; C2 is 12 with formula =A2+$B$1.
          references:
          - \ref[requirement](REQ-4.1.1)
          - \ref[requirement](REQ-3.2.1)
          - \ref[requirement](REQ-4.2.2)
      - id: SCN-REQ-4.1.2-02
        name: REQ-4.1.2 - Copy Formulas and Adjust Relative References - Scenario 2
        steps:
        - id: STEP-REQ-4.1.2-02-01
          Given: A1 is 2 and B1 is =A1.
          When: The user copies B1 to A1 and refreshes.
          Then: 'A1 displays #REF! with formula =#REF!, while B1 keeps =A1.'
          references:
          - \ref[requirement](REQ-4.1.1)
          - \ref[requirement](REQ-3.2.1)
          - \ref[requirement](REQ-4.2.2)
      children: []
  - id: REQ-4.2
    name: Dependency Updates and Error Handling
    description:
      text: Supports dependency recalculation after source data changes and isolation of formula errors. After REQ-3
        value edits, pastes, and moves or REQ-2 row/column changes, all affected formulas display results consistent
        with the current source data; one erroneous formula does not affect unrelated cells.
    scenarios: []
    children:
    - id: REQ-4.2.1
      name: Recalculate Dependent Formulas After Source Data Changes
      description:
        text: |-
          After a source-value edit, bulk paste, range move, or row/column structure change succeeds, all directly and indirectly dependent formulas update in dependency order; the Formula bar displays the currently stored expression, including any required reference rewrite, while the grid displays its recalculated result or error. An ordinary source-value change preserves dependent expressions; a cut or structural change rewrites only the affected references under its own rule. After refresh or reopening, results remain consistent with the current source values and must not show pre-change results; formulas in other worksheets that do not reference these source cells remain unchanged.

          The active worksheet uses grid role with accessible name Worksheet grid and aria-multiselectable=true. Cells use gridcell role and their coordinates as names; the selected cell and cells in a selected rectangular range expose aria-selected=true, and other cells expose aria-selected=false. Worksheet tabs use tab role and expose their active state through aria-selected.

          The current workbook retains its identity when revisiting or refreshing its visible state. Operations apply to the current active worksheet or workbook as stated and must not modify unrelated workbooks or worksheets.

          The Formula bar displays the stored formula while the grid displays its current calculated result. Edits, pastes, moves and row/column changes update dependent references and results; an erroneous formula does not corrupt unrelated cells.
      scenarios:
      - id: SCN-REQ-4.2.1-01
        name: REQ-4.2.1 - Recalculate Dependent Formulas After Source Data Changes - Scenario 1
        steps:
        - id: STEP-REQ-4.2.1-01-01
          Given: Sheet1 contains A1=10, B1=A1*2, C1=B1+5; Sheet2 contains Other and =1+1.
          When: The user changes Sheet1!A1 to 20, visits Sheet2, returns to Sheet1, and refreshes.
          Then: Sheet1 recalculates to 20, 40, 45; Sheet2 remains Other and 2; formulas remain visible in the formula
            bar.
          references:
          - \ref[requirement](REQ-2.2.1)
          - \ref[requirement](REQ-2.2.2)
          - \ref[requirement](REQ-3.1.1)
          - \ref[requirement](REQ-3.1.2)
          - \ref[requirement](REQ-3.2.1)
          - \ref[requirement](REQ-4.1.1)
      - id: SCN-REQ-4.2.1-02
        name: REQ-4.2.1 - Recalculate Dependent Formulas After Source Data Changes - Scenario 2
        steps:
        - id: STEP-REQ-4.2.1-02-01
          Given: A1=2, B1=A1*2, and C1=B1+1.
          When: The user pastes 3 into A1 and refreshes.
          Then: A1, B1, and C1 become 3, 6, and 7; dependent formulas remain intact.
          references:
          - \ref[requirement](REQ-2.2.1)
          - \ref[requirement](REQ-2.2.2)
          - \ref[requirement](REQ-3.1.1)
          - \ref[requirement](REQ-3.1.2)
          - \ref[requirement](REQ-3.2.1)
          - \ref[requirement](REQ-4.1.1)
      - id: SCN-REQ-4.2.1-03
        name: REQ-4.2.1 - Recalculate Dependent Formulas After Source Data Changes - Scenario 3
        steps:
        - id: STEP-REQ-4.2.1-03-01
          Given: A1=2, B1=3, C1=B1*2, and D1=C1+1.
          When: The user cuts A1 and pastes it into B1, then refreshes.
          Then: A1 is blank, B1 is 2, C1 is 4, and D1 is 5 with formulas =B1*2 and =C1+1.
          references:
          - \ref[requirement](REQ-2.2.1)
          - \ref[requirement](REQ-2.2.2)
          - \ref[requirement](REQ-3.1.1)
          - \ref[requirement](REQ-3.1.2)
          - \ref[requirement](REQ-3.2.1)
          - \ref[requirement](REQ-4.1.1)
      children: []
    - id: REQ-4.2.2
      name: Display and Fix Formula Errors
      description:
        text: |-
          Formula errors use stable visible values: division by zero displays #DIV/0!, an invalid reference displays #REF!, an unsupported function displays #NAME?, a malformed expression displays #ERROR!, and a direct or indirect circular reference displays #REF!. When an error cell is selected, the formula bar displays the stored formula submitted by the user; after refresh, both the error value and stored formula persist. An error cell does not block viewing, editing, or recalculating other cells. After the user changes it to a valid formula through REQ-3.1.1, the grid displays the new result, the formula bar displays the new formula, related dependent results update, and the error no longer appears after refresh.

          The active worksheet uses grid role with accessible name Worksheet grid and aria-multiselectable=true. Cells use gridcell role and their coordinates as names; the selected cell and cells in a selected rectangular range expose aria-selected=true, and other cells expose aria-selected=false. Worksheet tabs use tab role and expose their active state through aria-selected.

          The current workbook retains its identity when revisiting or refreshing its visible state. Operations apply to the current active worksheet or workbook as stated and must not modify unrelated workbooks or worksheets.

          The Formula bar displays the stored formula while the grid displays its current calculated result. Edits, pastes, moves and row/column changes update dependent references and results; an erroneous formula does not corrupt unrelated cells.
      scenarios:
      - id: SCN-REQ-4.2.2-01
        name: REQ-4.2.2 - Display and Fix Formula Errors - Scenario 1
        steps:
        - id: STEP-REQ-4.2.2-01-01
          Given: A1 is Keep and the workbook is blank otherwise.
          When: The user enters =1/0, =A0, =UNSUPPORTED(1), =1+, and =B5 in B1:B5, changes A1 to a unique value,
            pastes 3 and =C1*2 into C1:C2, and refreshes.
          Then: "The five cells display #DIV/0!, #REF!, #NAME?, #ERROR!, and #REF!, their stored formula expressions
            remain in the formula bar, unrelated A1 persists, and C2 evaluates to 6."
          references:
          - \ref[requirement](REQ-4.1.1)
      - id: SCN-REQ-4.2.2-02
        name: REQ-4.2.2 - Display and Fix Formula Errors - Scenario 2
        steps:
        - id: STEP-REQ-4.2.2-02-01
          Given: A1 is 2.
          When: The user enters =1/0 in B1, replaces it with =A1*3, and refreshes.
          Then: 'B1 changes from #DIV/0! to 6 and its formula bar contains =A1*3.'
          references:
          - \ref[requirement](REQ-4.1.1)
      - id: SCN-REQ-4.2.2-03
        name: REQ-4.2.2 - Display and Fix Formula Errors - Scenario 3
        steps:
        - id: STEP-REQ-4.2.2-03-01
          Given: A blank workbook is open.
          When: The user enters =B1 in A1 and =A1 in B1, then refreshes.
          Then: 'Both cells display #REF! while their entered formulas remain inspectable.'
          references:
          - \ref[requirement](REQ-4.1.1)
      - id: SCN-REQ-4.2.2-04
        name: REQ-4.2.2 - Display and Fix Formula Errors - Scenario 4
        steps:
        - id: STEP-REQ-4.2.2-04-01
          Given: A blank workbook is open.
          When: The user enters =NOPE(1) in A1 and =1+ in B1, then refreshes.
          Then: "A1 displays #NAME? and B1 displays #ERROR!, with both stored formula expressions preserved."
          references:
          - \ref[requirement](REQ-4.1.1)
      - id: SCN-REQ-4.2.2-05
        name: REQ-4.2.2 - Display and Fix Formula Errors - Scenario 5
        steps:
        - id: STEP-REQ-4.2.2-05-01
          Given: A blank workbook is open.
          When: The user enters =A1 in A1, replaces it with =2+2, and refreshes.
          Then: 'A1 changes from #REF! to 4 and its formula bar contains =2+2.'
          references:
          - \ref[requirement](REQ-4.1.1)
      children: []
  - id: REQ-5.1
    name: Sorting and Filtering
    description:
      text: Supports sorting a selected rectangular range in the current worksheet by column and filtering it by
        value or condition. Sorting and filtering apply only to the range selected by the user and do not expand
        to adjacent data or other worksheets; the same order and visible rows persist after refresh.
    scenarios: []
    children:
    - id: REQ-5.1.1
      name: Sort a Data Range by a Specified Column
      description:
        text: |-
          Users select a rectangular data range in the current active worksheet and choose "Sort range" from the "Data" menu. A dialog named "Sort range" provides combo boxes labeled "Sort by" and "Order", a "Data has header row" checkbox, and a "Sort" button. Options in "Sort by" use the header text of the selected range as accessible names; "Order" provides options named "Ascending" and "Descending". When the first row is declared a header, it does not participate in sorting. Numbers, parseable dates, and text are compared according to their respective types; equal sort keys preserve their original relative order, and entire records move together by row. After sorting, the formula bar displays references and results consistent with the new positions, filtering and validation continue to apply to the same selected range, and data outside the selection remains unchanged; order and results persist after refresh. If sorting fails, an error is displayed and the grid retains its original order.

          The active worksheet uses grid role with accessible name Worksheet grid and aria-multiselectable=true. Cells use gridcell role and their coordinates as names; the selected cell and cells in a selected rectangular range expose aria-selected=true, and other cells expose aria-selected=false. Worksheet tabs use tab role and expose their active state through aria-selected.

          The current workbook retains its identity when revisiting or refreshing its visible state. Operations apply to the current active worksheet or workbook as stated and must not modify unrelated workbooks or worksheets.

          Sorting and filtering apply only to the selected rectangular range, without expanding to adjacent data or other worksheets; the resulting order and row visibility persist after refresh.

          Sorting the selected range includes its filtered-out rows; the filter is then applied to the resulting saved row order. The header row remains fixed when Data has header row is selected. Clearing the filter later reveals that saved sorted order rather than the order before sorting. A formula carried with a sorted record must still produce the record's specified result at its new position, as in the Score/Double scenario.
        image:
        - id: IMG-SORT-RANGE
          reference: reference/sort-range.png
          page: workbook_editor
      scenarios:
      - id: SCN-REQ-5.1.1-01
        name: REQ-5.1.1 - Sort a Data Range by a Specified Column - Scenario 1
        steps:
        - id: STEP-REQ-5.1.1-01-01
          Given: A1:C5 contains Region/Sales/Status rows East/1200/Open, North/800/Closed, South/1200/Pending, West/500/Open;
            E1 is Outside.
          When: The user selects A1:C5 and sorts by Sales descending with a header row.
          Then: Rows order East, South, North, West with their matching values; E1 is unchanged and the order persists
            after refresh.
          references:
          - \ref[requirement](REQ-3.1.3)
          - \ref[requirement](REQ-4.2.1)
          - \ref[requirement](REQ-5.1.2)
          - \ref[requirement](REQ-5.2.1)
          - \ref[image](IMG-SORT-RANGE)
      - id: SCN-REQ-5.1.1-02
        name: REQ-5.1.1 - Sort a Data Range by a Specified Column - Scenario 2
        steps:
        - id: STEP-REQ-5.1.1-02-01
          Given: A1:C4 contains the rows [Name, Date, Value]; [Charlie, 2026-03-10, 30]; [Alpha, 2026-01-15, 10];
            [Bravo, 2026-02-01, 20].
          When: The user sorts by Name ascending, then by Date descending.
          Then: The final order is Charlie, Bravo, Alpha with matching dates and values, and it persists after refresh.
          references:
          - \ref[requirement](REQ-3.1.3)
          - \ref[requirement](REQ-4.2.1)
          - \ref[requirement](REQ-5.1.2)
          - \ref[requirement](REQ-5.2.1)
          - \ref[image](IMG-SORT-RANGE)
      - id: SCN-REQ-5.1.1-03
        name: REQ-5.1.1 - Sort a Data Range by a Specified Column - Scenario 3
        steps:
        - id: STEP-REQ-5.1.1-03-01
          Given: A1:C4 contains Item/Score/Double, scores 3, 1, 2, formulas C2:C4 =B*2, and validation B2:B4 from
            0 through 10.
          When: The user sorts Score ascending and attempts 11 in B2.
          Then: Rows order Bravo/1/2, Charlie/2/4, Alpha/3/6; formulas and validation remain; 11 is rejected and
            the result persists.
          references:
          - \ref[requirement](REQ-3.1.3)
          - \ref[requirement](REQ-4.2.1)
          - \ref[requirement](REQ-5.1.2)
          - \ref[requirement](REQ-5.2.1)
          - \ref[image](IMG-SORT-RANGE)
      - id: SCN-REQ-5.1.1-04
        name: REQ-5.1.1 - Sort a Data Range by a Specified Column - Scenario 4
        steps:
        - id: STEP-REQ-5.1.1-04-01
          Given: A1:B4 contains Item/Score with scores 3, 1, 2.
          When: The user filters Score greater than 1, sorts the selected range ascending, refreshes, clears the
            filter, and inspects the rows.
          Then: The filtered view hides the row with score 1, sorted visible rows are Charlie then Alpha, and clearing
            the filter restores Bravo, Charlie, Alpha.
          references:
          - \ref[requirement](REQ-3.1.3)
          - \ref[requirement](REQ-4.2.1)
          - \ref[requirement](REQ-5.1.2)
          - \ref[requirement](REQ-5.2.1)
          - \ref[image](IMG-SORT-RANGE)
      - id: SCN-REQ-5.1.1-05
        name: REQ-5.1.1 - Sort a Data Range by a Specified Column - Scenario 5
        steps:
        - id: STEP-REQ-5.1.1-05-01
          Given: A1:C4 contains Alpha/3/First, Bravo/3/Second, Charlie/1/Third.
          When: The user sorts by Score ascending.
          Then: Charlie is first, followed by Alpha then Bravo, and that order persists after refresh.
          references:
          - \ref[requirement](REQ-3.1.3)
          - \ref[requirement](REQ-4.2.1)
          - \ref[requirement](REQ-5.1.2)
          - \ref[requirement](REQ-5.2.1)
          - \ref[image](IMG-SORT-RANGE)
      - id: SCN-REQ-5.1.1-06
        name: REQ-5.1.1 - Sort a Data Range by a Specified Column - Scenario 6
        steps:
        - id: STEP-REQ-5.1.1-06-01
          Given: A1:C4 contains names with dates Alpha/2026-01-10, Bravo/2026-03-20, Charlie/2026-02-15; E1 is Outside.
          When: The user sorts A1:C4 by Date descending.
          Then: Rows order Bravo, Charlie, Alpha; E1 remains Outside and the order persists after refresh.
          references:
          - \ref[requirement](REQ-3.1.3)
          - \ref[requirement](REQ-4.2.1)
          - \ref[requirement](REQ-5.1.2)
          - \ref[requirement](REQ-5.2.1)
          - \ref[image](IMG-SORT-RANGE)
      children: []
    - id: REQ-5.1.2
      name: Filter Rows by Value or Condition
      description:
        text: |-
          Users create a filter for a data region with headers in the current active worksheet through "Create filter" in the "Data" menu. Each header provides a button with the accessible name "Filter <header text>"; the dialog with the same name supports selecting specific values and condition options named "Text contains", "Greater than", "Before", "Is empty", and "Is not empty". The value-filter dialog provides "Clear selection", checkboxes generated from distinct source values, and "Apply"; each checkbox uses the displayed source value as its accessible name. The condition dialog provides a combo box labeled "Condition", a text box labeled "Value", and "Apply". "Text contains", "Greater than", and "Before" use the "Value" text box; "Is empty" and "Is not empty" require no value. Conditions on different columns are combined with AND; nonmatching rows are hidden only and are neither deleted nor reordered. After refresh or reopening, the same rows remain visible. CSV export and pivot summarization still include hidden rows within the filtered range. "Clear filter" removes the active filtering conditions and reveals all current source records in their current saved row order. It does not undo successful edits, sorting, or row/column changes made while the filter was active. Filtering itself neither changes source values nor changes row order. After refresh all source rows remain visible, while formula and validation behavior are unchanged.

          The active worksheet uses grid role with accessible name Worksheet grid and aria-multiselectable=true. Cells use gridcell role and their coordinates as names; the selected cell and cells in a selected rectangular range expose aria-selected=true, and other cells expose aria-selected=false. Worksheet tabs use tab role and expose their active state through aria-selected.

          The current workbook retains its identity when revisiting or refreshing its visible state. Operations apply to the current active worksheet or workbook as stated and must not modify unrelated workbooks or worksheets.

          Sorting and filtering apply only to the selected rectangular range, without expanding to adjacent data or other worksheets; the resulting order and row visibility persist after refresh.
      scenarios:
      - id: SCN-REQ-5.1.2-01
        name: REQ-5.1.2 - Filter Rows by Value or Condition - Scenario 1
        steps:
        - id: STEP-REQ-5.1.2-01-01
          Given: A1:C6 contains Region/Sales/Status rows East/1200/Open, East/900/Closed, North/2000/Open, East/1500/Closed,
            South/700/Open.
          When: The user filters Region to East and Sales greater than 1000, refreshes, then clears the filter.
          Then: Only rows 2 and 5 are visible while filtered; clearing restores all five source rows and their values.
          references:
          - \ref[requirement](REQ-3.1.3)
          - \ref[requirement](REQ-3.1.1)
      - id: SCN-REQ-5.1.2-02
        name: REQ-5.1.2 - Filter Rows by Value or Condition - Scenario 2
        steps:
        - id: STEP-REQ-5.1.2-02-01
          Given: A1:C4 contains names Alpha East, Alpha West, Beta; dates 2026-01-10, 2026-02-10, 2025-12-01; Note
            is blank, Filled, blank.
          When: Apply Name contains Alpha, Date before 2026-02-01, and Note is empty together, then refresh. Clear all
            filter conditions, create a new filter containing only Note is not empty, then refresh again.
          Then: The first filter shows only Alpha East; the second shows only Alpha West; each state persists after
            refresh.
          references:
          - \ref[requirement](REQ-3.1.3)
          - \ref[requirement](REQ-3.1.1)
      - id: SCN-REQ-5.1.2-03
        name: REQ-5.1.2 - Filter Rows by Value or Condition - Scenario 3
        steps:
        - id: STEP-REQ-5.1.2-03-01
          Given: A1:B4 contains the rows [Region, Sales]; [East, 100]; [North, 200]; [East, 300].
          When: The user filters Region to East, exports the sheet, and refreshes.
          Then: North's row is hidden in the grid, the export contains the complete original CSV, and the filter
            remains after refresh.
          references:
          - \ref[requirement](REQ-3.1.3)
          - \ref[requirement](REQ-3.1.1)
      - id: SCN-REQ-5.1.2-04
        name: REQ-5.1.2 - Filter Rows by Value or Condition - Scenario 4
        steps:
        - id: STEP-REQ-5.1.2-04-01
          Given: A1:C4 contains Region/Sales/Status rows East/1200/Open, North/800/Closed, East/600/Open.
          When: The user creates a filter, filters Status to Open, and refreshes.
          Then: The visible rows are the two Open records and the filter remains active after refresh.
          references:
          - \ref[requirement](REQ-3.1.3)
          - \ref[requirement](REQ-3.1.1)
      - id: SCN-REQ-5.1.2-05
        name: REQ-5.1.2 - Filter Rows by Value or Condition - Scenario 5
        steps:
        - id: STEP-REQ-5.1.2-05-01
          Given: A1:B4 contains the rows [Region, Sales]; [East, 100]; [North, 200]; [East, 300].
          When: The user creates a filter, filters Sales greater than 150, and refreshes.
          Then: Only North/200 and East/300 remain visible and the condition persists.
          references:
          - \ref[requirement](REQ-3.1.3)
          - \ref[requirement](REQ-3.1.1)
      children: []
  - id: REQ-5.2
    name: Data Validation
    description:
      text: |-
        Supports configuring dropdown or numeric validation for ranges in the current active worksheet. The same rules are enforced when writing through the grid, formula bar, paste, or range move; after row or column changes, dropdown buttons and numeric limits move with the originally constrained cells. Rules remain active after refresh and existing valid values are preserved.

        For validation rules attached to worksheet ranges: Created and edited through the data-validation dialog for a selected worksheet range. Rule parameters are supplied by the caller, not preconfigured on a blank workbook.
    scenarios: []
    children:
    - id: REQ-5.2.1
      name: Set Dropdown or Numeric Validation for a Range
      description:
        text: |-
          Users select a target range and click "Data validation" in the "Data" menu. A dialog named "Data validation" provides a combo box labeled "Rule type"; "Dropdown" uses a text box labeled "Allowed values", where comma-separated items are trimmed of leading and trailing spaces; "Number range" uses text boxes labeled "Minimum" and "Maximum"; the "Save" button applies an inclusive rule. After a valid save succeeds, the dialog closes. A dropdown cell provides a button with the accessible name "Open dropdown for <cell coordinate>"; each option uses the ARIA option role and the trimmed allowed value as its accessible name. If an invalid value is entered through the grid, formula bar, paste, or range move, the entire operation is rejected and the original value remains; an invalid dropdown value displays "Please select one of the following values: <comma-separated allowed values>", while an invalid number displays "Please enter a number between <minimum> and <maximum>". If any target in a bulk operation is invalid, all targets retain their original values. Rules remain active after refresh. When an existing rule is reopened, the dialog is prefilled with the rule type and parameters and displays a "Delete rule" button; saving a modification makes the new range effective immediately, deleting removes the constraint, and either successful operation closes the dialog without changing existing cell values.

          The active worksheet uses grid role with accessible name Worksheet grid and aria-multiselectable=true. Cells use gridcell role and their coordinates as names; the selected cell and cells in a selected rectangular range expose aria-selected=true, and other cells expose aria-selected=false. Worksheet tabs use tab role and expose their active state through aria-selected.

          The current workbook retains its identity when revisiting or refreshing its visible state. Operations apply to the current active worksheet or workbook as stated and must not modify unrelated workbooks or worksheets.

          Validation is enforced for grid edits, formula-bar edits, paste and range moves. After row or column changes, rules and dropdown actions remain attached to their originally constrained cells; valid saved values remain intact.
      scenarios:
      - id: SCN-REQ-5.2.1-01
        name: REQ-5.2.1 - Set Dropdown or Numeric Validation for a Range - Scenario 1
        steps:
        - id: STEP-REQ-5.2.1-01-01
          Given: A blank workbook is open.
          When: The user applies a Dropdown rule to A1:A2 with Not Started, In Progress, Completed, selects In Progress
            in A1, and refreshes.
          Then: A1 displays In Progress, dropdown controls are available in A1 and A2, and the rule persists.
          references:
          - \ref[requirement](REQ-3.1.1)
          - \ref[requirement](REQ-3.1.2)
          - \ref[requirement](REQ-3.1.3)
          - \ref[requirement](REQ-3.2.1)
      - id: SCN-REQ-5.2.1-02
        name: REQ-5.2.1 - Set Dropdown or Numeric Validation for a Range - Scenario 2
        steps:
        - id: STEP-REQ-5.2.1-02-01
          Given: A1 is 50.
          When: The user applies a Number range rule 0 through 100, attempts 120 and 101, then enters 100 and refreshes.
          Then: Each out-of-range attempt shows the exact range error and preserves 50; 100 is accepted and persists.
          references:
          - \ref[requirement](REQ-3.1.1)
          - \ref[requirement](REQ-3.1.2)
          - \ref[requirement](REQ-3.1.3)
          - \ref[requirement](REQ-3.2.1)
      - id: SCN-REQ-5.2.1-03
        name: REQ-5.2.1 - Set Dropdown or Numeric Validation for a Range - Scenario 3
        steps:
        - id: STEP-REQ-5.2.1-03-01
          Given: A1 is 50.
          When: The user configures number validation 0 through 100 through the data menu, attempts 120 through
            the grid, and refreshes.
          Then: The range error is shown, A1 remains 50, and the validation remains active.
          references:
          - \ref[requirement](REQ-3.1.1)
          - \ref[requirement](REQ-3.1.2)
          - \ref[requirement](REQ-3.1.3)
          - \ref[requirement](REQ-3.2.1)
      - id: SCN-REQ-5.2.1-04
        name: REQ-5.2.1 - Set Dropdown or Numeric Validation for a Range - Scenario 4
        steps:
        - id: STEP-REQ-5.2.1-04-01
          Given: A1 is 50 with number validation 0 through 100.
          When: The user edits the rule to 10 through 60, rejects 5, deletes the rule, enters 5, and refreshes.
          Then: The edited bounds reject 5 while active; after deletion 5 is accepted and persists.
          references:
          - \ref[requirement](REQ-3.1.1)
          - \ref[requirement](REQ-3.1.2)
          - \ref[requirement](REQ-3.1.3)
          - \ref[requirement](REQ-3.2.1)
      - id: SCN-REQ-5.2.1-05
        name: REQ-5.2.1 - Set Dropdown or Numeric Validation for a Range - Scenario 5
        steps:
