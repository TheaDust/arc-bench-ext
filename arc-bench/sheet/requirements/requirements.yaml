  - id: REQ-5.3
    name: Basic Pivot Summarization
    description:
      text: |-
        Supports creating a basic pivot table from a data range in the current worksheet. Pivot results reside in a separate worksheet and only read source data; when switching back to the source worksheet, original values and order remain unchanged, and pivot results persist after refresh or reopening.

        For pivot definitions linked to a source worksheet and range: Created through the pivot UI using the current source worksheet and range, with a destination worksheet. Row, column, value and summary selections are supplied through the editor; rejected selections do not become saved definitions.
    scenarios: []
    children:
    - id: REQ-5.3.1
      name: Create and Refresh a Basic Pivot Table
      description:
        text: |-
          Users select a source range containing headers and click "Create pivot table" in the "Data" menu. A dialog named "Create pivot table" displays visible text in the format "Source range: <cell range>", provides a "New worksheet" radio option and a "Create" button; when no pivot-result worksheet exists, the first unused PivotN name is used, so Pivot1 is created. A region named "Pivot table editor" provides combo boxes labeled "Rows", "Columns", "Values", and "Summarize by", plus an "Apply" button. Options for "Rows", "Columns", and "Values" use source header text as accessible names; "Summarize by" provides options named SUM, COUNT, and AVERAGE. The configuration supports one row field, one optional column field, and one value field. SUM/AVERAGE aggregate only parseable numbers, while COUNT counts non-empty records in the value field and does not fail because of nonnumeric content.
          When no column field is selected, A1 displays the row-field name and B1 displays "<summarization method> of <value field>"; row groups are ordered by first appearance in the source data, and the final row is Grand Total aggregating all qualifying source records. When a column field is selected, A1 displays the row-field name, column-field values are arranged from B1 onward in order of first appearance, and the final column is Grand Total; row-field values are likewise ordered by first appearance, with Grand Total as the final row. COUNT displays 0 when a row/column combination has no record with a non-empty value field.
          After a successful apply, refreshing or reopening still shows the same pivot worksheet, field layout, summarization method, and results. The result worksheet provides a "Refresh pivot table" button; after source data or row/column changes, clicking refresh completely replaces the old summary using the current source range. If a selected source header has been deleted, clicking refresh displays "Pivot field is no longer available. Select a new field.", preserves the last successful result, and does not modify the source worksheet; other invalid source ranges or fields likewise display a visible error and preserve both worksheets. When SUM or AVERAGE is applied to a value field with no parseable numbers, "Value field requires numeric values" is displayed, the old result is preserved, and the source worksheet is not modified.

          The active worksheet uses grid role with accessible name Worksheet grid and aria-multiselectable=true. Cells use gridcell role and their coordinates as names; the selected cell and cells in a selected rectangular range expose aria-selected=true, and other cells expose aria-selected=false. Worksheet tabs use tab role and expose their active state through aria-selected.

          The current workbook retains its identity when revisiting or refreshing its visible state. Operations apply to the current active worksheet or workbook as stated and must not modify unrelated workbooks or worksheets.

          Pivot definitions read the selected source worksheet/range and store results in a separate worksheet. Returning to the source retains its original values and order; changing a source layout adjusts the references used on refresh.

          The saved pivot definition and its last successful result form the applied state. Changes to source data or structure do not silently replace that result; Refresh pivot table recomputes it from the adjusted current source. A rejected Apply or Refresh retains the last successful applied field selection, aggregation method and result after reopening, as well as the unchanged source data. The editor may retain attempted choices for correction, but those choices do not become the saved definition until Apply succeeds.
      scenarios:
      - id: SCN-REQ-5.3.1-01
        name: REQ-5.3.1 - Create and Refresh a Basic Pivot Table - Scenario 1
        steps:
        - id: STEP-REQ-5.3.1-01-01
          Given: 'The user creates a blank workbook and enters the following rows through the grid or clipboard
            into Sheet1!A1:B6, in this order: headers Region/Sales; East/1200; North/800; East/600; South/1000;
            North/700. These cells are UI-created input, not seeded workbook records.'
          When: The user creates Pivot1 from A1:B6, selects Region as rows and Sales as SUM, and applies.
          Then: Pivot1 shows East 1800, North 1500, South 1000, and Grand Total 4300; Sheet1 remains unchanged and
            Pivot1 persists after refresh.
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[requirement](REQ-2.2.1)
          - \ref[requirement](REQ-2.2.2)
          - \ref[requirement](REQ-3.1.3)
          - \ref[requirement](REQ-5.1.2)
      - id: SCN-REQ-5.3.1-02
        name: REQ-5.3.1 - Create and Refresh a Basic Pivot Table - Scenario 2
        steps:
        - id: STEP-REQ-5.3.1-02-01
          Given: Sheet1!A1:B4 contains the rows [Region, Sales]; [East, 1200]; [North, 800]; [East, 600].
          When: The user creates a Region/Sales SUM pivot, changes Sheet1!B2 to 1500, and refreshes the pivot.
          Then: Pivot1 updates to East 2100, North 800, Grand Total 2900 and persists.
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[requirement](REQ-2.2.1)
          - \ref[requirement](REQ-2.2.2)
          - \ref[requirement](REQ-3.1.3)
          - \ref[requirement](REQ-5.1.2)
      - id: SCN-REQ-5.3.1-03
        name: REQ-5.3.1 - Create and Refresh a Basic Pivot Table - Scenario 3
        steps:
        - id: STEP-REQ-5.3.1-03-01
          Given: A1:C6 contains Region/Quarter/Sales with East Q1 100, East Q1 200, East Q2 150, North Q1 300, North
            Q2 blank.
          When: The user creates a Region-row, Quarter-column, Sales-COUNT pivot.
          Then: "Pivot1!A1:D4 contains the following rows in order: [Region, Q1, Q2, Grand Total]; [East, 2, 1, 3];
            [North, 1, 0, 1]; [Grand Total, 3, 1, 4]. The blank North/Q2 Sales cell contributes zero to COUNT. The field
            layout and every group and total persist after refresh."
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[requirement](REQ-2.2.1)
          - \ref[requirement](REQ-2.2.2)
          - \ref[requirement](REQ-3.1.3)
          - \ref[requirement](REQ-5.1.2)
      - id: SCN-REQ-5.3.1-04
        name: REQ-5.3.1 - Create and Refresh a Basic Pivot Table - Scenario 4
        steps:
        - id: STEP-REQ-5.3.1-04-01
          Given: Sheet1!A1:B6 contains the rows [Region, Sales]; [East, 100]; [East, not numeric]; [East, 300]; [North,
            200]; [North, empty]. The last Sales cell is empty, not the literal word empty.
          When: The user creates a Region/Sales AVERAGE pivot.
          Then: 'Pivot1 averages numeric values only: East 200, North 200, Grand Total 200; source text remains
            unchanged after refresh.'
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[requirement](REQ-2.2.1)
          - \ref[requirement](REQ-2.2.2)
          - \ref[requirement](REQ-3.1.3)
          - \ref[requirement](REQ-5.1.2)
      - id: SCN-REQ-5.3.1-05
        name: REQ-5.3.1 - Create and Refresh a Basic Pivot Table - Scenario 5
        steps:
        - id: STEP-REQ-5.3.1-05-01
          Given: A1:B4 contains Region/Status East/Open, East/Closed, North/Open.
          When: The user creates a Status-row, Region-value COUNT pivot, then attempts to change the summary to
            SUM.
          Then: The applied COUNT table is [Status, COUNT of Region]; [Open, 2]; [Closed, 1]; [Grand Total, 3]. SUM is
            rejected with Value field requires numeric values, preserving this complete result and source content. After
            reopening and refresh, Rows=Status, Values=Region and Summarize by=COUNT remain the applied configuration
            and the complete COUNT result persists.
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[requirement](REQ-2.2.1)
          - \ref[requirement](REQ-2.2.2)
          - \ref[requirement](REQ-3.1.3)
          - \ref[requirement](REQ-5.1.2)
      - id: SCN-REQ-5.3.1-06
        name: REQ-5.3.1 - Create and Refresh a Basic Pivot Table - Scenario 6
        steps:
        - id: STEP-REQ-5.3.1-06-01
          Given: Sheet1!A1:B4 contains the rows [Region, Sales]; [East, 100]; [North, 200]; [East, 300], with an active
            filter showing only East.
          When: The user creates a Region/Sales SUM pivot from the filtered range and refreshes it.
          Then: Pivot1 shows East 400, North 200, Grand Total 600 and remains unchanged after refresh.
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[requirement](REQ-2.2.1)
          - \ref[requirement](REQ-2.2.2)
          - \ref[requirement](REQ-3.1.3)
          - \ref[requirement](REQ-5.1.2)
      - id: SCN-REQ-5.3.1-07
        name: REQ-5.3.1 - Create and Refresh a Basic Pivot Table - Scenario 7
        steps:
        - id: STEP-REQ-5.3.1-07-01
          Given: Sheet1!A1:B4 contains the rows [Region, Sales]; [East, 100]; [North, 200]; [East, 300]. Pivot1 has an
            applied Region-row, Sales-SUM definition over A1:B4.
          When: The user inserts a source row East/50, refreshes Pivot1, inserts a source column left of Sales,
            refreshes again, and reloads.
          Then: The pivot totals update to East 450, North 200, Grand Total 650 and persist.
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[requirement](REQ-2.2.1)
          - \ref[requirement](REQ-2.2.2)
          - \ref[requirement](REQ-3.1.3)
          - \ref[requirement](REQ-5.1.2)
      - id: SCN-REQ-5.3.1-08
        name: REQ-5.3.1 - Create and Refresh a Basic Pivot Table - Scenario 8
        steps:
        - id: STEP-REQ-5.3.1-08-01
          Given: Sheet1!A1:B4 contains the rows [Region, Sales]; [East, 100]; [North, 200]; [East, 300]. Pivot1 has an
            applied Region-row, Sales-SUM definition over A1:B4.
          When: Delete the source Sales column, attempt Refresh pivot table, reopen and reload Pivot1, inspect its
            remaining applied field selections, and attempt Refresh pivot table again.
          Then: Each refresh attempt displays Pivot field is no longer available. Select a new field. The last
            successful table [Region, SUM of Sales]; [East, 400]; [North, 200]; [Grand Total, 600] remains before and
            after reload. Rows=Region and Summarize by=SUM remain applied; the removed value field remains unavailable.
            The source stays in its post-deletion state and is not restored or modified by either refusal.
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[requirement](REQ-2.2.1)
          - \ref[requirement](REQ-2.2.2)
          - \ref[requirement](REQ-3.1.3)
          - \ref[requirement](REQ-5.1.2)
      - id: SCN-REQ-5.3.1-09
        name: REQ-5.3.1 - Create and Refresh a Basic Pivot Table - Scenario 9
        steps:
        - id: STEP-REQ-5.3.1-09-01
          Given: Sheet1!A1:B5 contains the rows [Region, Status]; [East, Open]; [East, Closed]; [North, Open]; [South, Open].
          When: The user creates a Region-row, Status-value COUNT pivot and refreshes.
          Then: "Pivot1!A1:B5 contains the following rows in order: [Region, COUNT of Status]; [East, 2]; [North, 1];
            [South, 1]; [Grand Total, 4]. The saved field configuration and all four counts remain after refresh."
          references:
          - \ref[requirement](REQ-2.1.1)
          - \ref[requirement](REQ-2.2.1)
          - \ref[requirement](REQ-2.2.2)
          - \ref[requirement](REQ-3.1.3)
          - \ref[requirement](REQ-5.1.2)
      children: []
- id: REQ-6
  name: Transactional edits and formula identity
  description:
    text: |-
      Use deterministic small worksheets to verify cut and paste, reference mapping, validation and history as a single user operation.
  scenarios: []
  children:
  - id: REQ-6.1
    name: Make validated cuts atomic across formulas and history
    description:
      text: |-
        Cut and Paste of a rectangular range is one transaction. Validate the entire proposed final worksheet before saving, including values produced by formulas in validated destination cells. Numeric rules test the calculated numeric value, not the stored formula text. If any destination fails its rule, leave all source and destination values, formulas, validation rules and dependent results unchanged. A refused paste adds no undo entry and does not clear existing redo history. On success the destination is written and only source cells outside it are cleared. A reference to a moved source cell follows its new coordinate, even if the formula itself does not move; preserve dollar markers. A reference to a cell outside the source keeps its coordinate. Recalculate all dependent values before the edit is observable. One Undo restores the complete prior worksheet; one Redo reapplies the complete move. Saved worksheet state persists across reload; history across reload is not required.
    scenarios:
    - id: SCN-REQ-6.1-01
      name: Refuse a final-cell validation failure without consuming undo
      steps:
      - id: STEP-REQ-6.1-01-01
        Given: |-
          A1:B2 contains 10, 20, =A1+B1, 120 in row order; D1:E2 contains 1, 2, 3, 4. G1 is =A2+D2 and H1 is =G1+E2. Apply a 0–100 numeric rule to E2, then enter History marker in H2 as a separate edit.
        When: |-
          Cut A1:B2 and paste at D1. Inspect the validation error and worksheet, click Undo once, repeat the rejected cut, then Redo once and reload.
        Then: |-
          The 120 in the final destination cell causes rejection. All eight source/target cells, both downstream formulas and their results (33 and 37), and the marker initially remain unchanged. Undo removes only the marker. The second failed cut leaves the marker blank and preserves the redo entry; Redo restores only the marker. After reload the same values and formulas remain, and E2 still rejects 101.
        references:
        - \ref[requirement](REQ-3.2.1)
        - \ref[requirement](REQ-3.2.2)
        - \ref[requirement](REQ-4.2.1)
        - \ref[requirement](REQ-5.2.1)
    - id: SCN-REQ-6.1-02
      name: Undo and redo a validated move with chained external dependencies
      steps:
      - id: STEP-REQ-6.1-02-01
        Given: |-
          A1:B2 contains 10, 20, =A1+B1, 60 in row order; D1:E2 contains 1, 2, 3, 4. G1 is =A2+D2 and H1 is =G1+E2. H2 is blank and E2 has an inclusive 0–100 numeric rule.
        When: |-
          Cut A1:B2 and paste at D1. Undo once, Redo once, then reload.
        Then: |-
          A1:B2 becomes blank and D1:E2 becomes 10, 20, =D1+E1, 60. G1 becomes =D2+D2 with result 60; H1 retains =G1+E2 and becomes 120. Undo restores the complete pre-move worksheet including G1=33 and H1=37; Redo and reload retain the complete moved state. The 0–100 validation at E2 remains enforced.
        references:
        - \ref[requirement](REQ-3.2.1)
        - \ref[requirement](REQ-3.2.2)
        - \ref[requirement](REQ-4.2.1)
        - \ref[requirement](REQ-5.2.1)
    children: []
  - id: REQ-6.2
    name: Resolve overlapping cuts using original cell identities
    description:
      text: |-
        A same-worksheet cut can overlap its destination. Each destination receives the content of its corresponding source cell from the pre-paste state, and only source cells outside the destination are cleared. Retarget each reference to an original source cell to that cell's new coordinate, including references in unmoved formulas and absolute references, preserving their dollar markers. References to cells outside the source retain their coordinates even in moved formulas. Apply these mappings once; do not recursively retarget the coordinates already produced by the move. Validate against the resulting proposed worksheet, and treat the whole move and its derived updates as one undoable transaction.
    scenarios:
    - id: SCN-REQ-6.2-01
      name: Move an overlapping rectangle without chasing rewritten references
      steps:
      - id: STEP-REQ-6.2-01-01
        Given: |-
          A1=4, B1=7, A2 is =A1+$E$1, B2 is =A2+$B$1, C1=90, C2=9 and E1=10. F1 is =A2+B2+C1 and G1 is =F1*2.
        When: |-
          Cut A1:B2, paste at B1, inspect, then Undo once, Redo once and reload.
        Then: |-
          A1:A2 is cleared. B1:C2 holds 4, 7, =B1+$E$1 and =B2+$C$1 in row order, with calculated results 14 and 21. E1 stays 10. F1 becomes =B2+C2+C1 and shows 42, and G1 shows 84. Undo restores the original values and formulas, including F1=125 and G1=250. Redo and reload restore the same moved state.
        references:
        - \ref[requirement](REQ-6.1)
        - \ref[requirement](REQ-4.1.2)
        - \ref[requirement](REQ-4.2.1)
    - id: SCN-REQ-6.2-02
      name: Validate an overlapping move against its calculated final values
      steps:
      - id: STEP-REQ-6.2-02-01
        Given: |-
          A1=4, B1=7, A2 is =A1+$E$1, B2 is =A2+$B$1, C1=90, C2=9 and E1=10. F1 is =A2+B2+C1 and G1 is =F1*2. C2 has an inclusive numeric range 0–20. Moving A1:B2 to B1 would yield 21 in C2.
        When: |-
          Cut A1:B2 and paste at B1; inspect the refusal. Then change A1 to 2, cut the same range again and paste at B1. Undo once, Redo once and reload. Try entering 21 directly in C2.
        Then: |-
          The failed paste keeps all original raw values, formulas and results. The retry succeeds with results B2=12, C2=19, F1=38 and G1=76 and the same rewritten formulas as the valid overlap. Undo restores the pre-retry worksheet (A1=2, F1=121, G1=242), not the original A1=4. Redo and reload keep the complete moved state. C2 still rejects 21; its saved formula and all dependent results remain intact.
        references:
        - \ref[requirement](REQ-6.1)
        - \ref[requirement](REQ-4.1.2)
        - \ref[requirement](REQ-4.2.1)
    children: []
