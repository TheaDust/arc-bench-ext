id: ROOT
name: BookStack knowledge base
description:
  text: |-
    A knowledge base for organizing and reading shelves, books, chapters, and pages.

    Controls are identified by their declared role and exact accessible name. Textboxes may derive their names from associated labels or ARIA naming. Required-field indicators preserve those names; placeholders are optional presentation details.

    Dates and time-dependent content use UTC and the shared application/evaluator clock 2026-10-06T12:00:00Z.

    For session and personal dashboard state: Established through login, opening content, favoriting content, or saving pages/drafts. No private storage injection.
    Native masked password inputs are identified by their exact associated accessible label and password type; an explicit textbox role is not required for these native inputs. Other declared field roles and names remain required. A combobox may use a native select or an accessible popup: choices and selected state are compared by their visible labels, not private option values or a required DOM nesting.

    The initialized application contains two verified accounts: BookStack User (bookstack_user@example.com / Password123!) and BookStack Reviewer (bookstack_reviewer@example.com / Password123!). Scenarios that require cross-user isolation use the named account; other scenarios use BookStack User.

scenarios: []
children:
- id: REQ-1
  name: Application entry and navigation
  description:
    text: |-
      The logged-out homepage provides search input and links to Login, Shelves and Books. These entry points are available throughout the content flows. Visual layout follows the supplied references; search behavior is not specified by this source.

      Content metadata and personal preferences persist across navigation and reload.
  scenarios: []
  children:
  - id: REQ-1.1
    name: Open the application
    description:
      text: |-
        Opening the application homepage at / while logged out displays "Login"(role=link), "Shelves"(role=link), and "Books"(role=link) as its public entry points.

        The logged-out homepage also provides a search input; search behavior is not specified. Login, Shelves, and Books entry points remain available throughout the content flows.
      image:
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
    scenarios:
    - id: SCN-REQ-1.1-01
      name: Show logged-out navigation
      steps:
      - id: STEP-REQ-1.1-01-01
        Given: A fresh anonymous browser opens the initialized knowledge base; verified account and bootstrap shelf
          exist, but no session has been established.
        When: Open / and inspect the homepage entry links.
        Then: The homepage displays visible Login, Shelves and Books links with their declared accessible names.
        references:
        - \ref[image](IMG-INDEX)
    children: []
  - id: REQ-1.2
    name: Return home
    description:
      text: Opening / from the shelves list returns to the homepage, which exposes "Login"(role=link), "Shelves"(role=link),
        and "Books"(role=link).
      image:
      - id: IMG-SHELVES
        reference: reference/shelves.png
        page: shelves
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
    scenarios:
    - id: SCN-REQ-1.2-01
      name: Return from shelves
      steps:
      - id: STEP-REQ-1.2-01-01
        Given: |-
          The anonymous homepage is open and the seeded Benchmark Bootstrap Shelf is available in Shelf list.
          Seed prerequisites (prepared before this scenario):
          - bootstrap shelf: {"name": "Benchmark Bootstrap Shelf", "description": "Entry shelf for the New Shelf creation action.", "tags": [], "books": []}
        When: Click Shelves, verify Shelf list opens, then open / to return to the homepage.
        Then: The homepage returns with its Books link visible.
        references:
        - \ref[requirement](REQ-4.1)
        - \ref[image](IMG-SHELVES)
        - \ref[image](IMG-INDEX)
    children: []
- id: REQ-2
  name: Account access
  description:
    text: |-
      A preverified account can log in; account registration is outside scope. Content browsing and the source-described content mutations remain available while logged out; drafts and personal lists require login.

      For verified account: Registration and verification are outside scope; the scenarios use the existing verified account described below.
  scenarios: []
  children:
  - id: REQ-2.1
    name: Open login
    description:
      text: |-
        Clicking "Login"(role=link) in navigation opens a login form containing "Email"(role=textbox), "Password"(role=textbox), an initially unchecked "Remember Me"(role=checkbox), and a Login submit action.

        Registration is outside scope. Content browsing and the declared content mutations remain available while logged out; drafts and personal lists require login.
      image:
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
      - id: IMG-LOGIN
        reference: reference/login.png
        page: login
    scenarios:
    - id: SCN-REQ-2.1-01
      name: Show login form
      steps:
      - id: STEP-REQ-2.1-01-01
        Given: A fresh browser is on the anonymous application entry with Login available on the page.
        When: Click the Login navigation link and inspect the displayed form.
        Then: Email and Password fields and the Login submit button are visible; Remember Me is present and unchecked.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-LOGIN)
    children: []
  - id: REQ-2.2
    name: Authenticate verified account
    description:
      text: Users enter a verified account's credentials in "Email"(role=textbox) and "Password"(role=textbox),
        select "Remember Me"(role=checkbox), and submit the form reached through "Login"(role=link). Successful
        authentication returns to the homepage, shows BookStack User in the top-right user area, and enables the
        personal dashboard lists. Invalid-credential wording is unspecified.
      image:
      - id: IMG-INDEX-AFTER-LOGIN
        reference: reference/index_after_login.png
        page: home
      - id: IMG-LOGIN
        reference: reference/login.png
        page: login
    scenarios:
    - id: SCN-REQ-2.2-01
      name: Log in with remember me
      steps:
      - id: STEP-REQ-2.2-01-01
        Given: |-
          verified account contains verified bookstack_user@example.com with Password123! and nickname BookStack User; the browser is anonymous on the application entry.
          Seed prerequisites (prepared before this scenario):
          - verified account: {"nickname": "BookStack User", "email": "bookstack_user@example.com", "password": "Password123!"}
        When: Click Login on the page, fill Email and Password with those credentials, check Remember Me, and click
          the Login submit button.
        Then: The homepage visibly displays BookStack User and My Recent Drafts, confirming authentication and access
          to the personal dashboard. No unprovided remember-me expiry guarantee is inferred.
        references:
        - \ref[requirement](REQ-2.1)
        - \ref[image](IMG-INDEX-AFTER-LOGIN)
        - \ref[image](IMG-LOGIN)
    children: []
- id: REQ-3
  name: Authenticated dashboard
  description:
    text: The authenticated homepage shows recent drafts, recently viewed items, most viewed favorites, recently
      updated pages, recent activity and dashboard controls as visually referenced.
  scenarios: []
  children:
  - id: REQ-3.1
    name: View authenticated dashboard
    description:
      text: |-
        Successful login displays an authenticated dashboard with "My Recent Drafts"(role=region), "My Recently Viewed"(role=region), "My Most Viewed Favorites"(role=region), and "Recently Updated Pages"(role=region), each containing its corresponding personal or content list. Recent activity and dashboard controls also follow the visual reference.

        Dates and time-dependent content use UTC and the shared clock 2026-10-06T12:00:00Z.
      image:
      - id: IMG-LOGIN
        reference: reference/login.png
        page: login
      - id: IMG-INDEX-AFTER-LOGIN
        reference: reference/index_after_login.png
        page: home
    scenarios:
    - id: SCN-REQ-3.1-01
      name: Show personal dashboard regions
      steps:
      - id: STEP-REQ-3.1-01-01
        Given: |-
          The verified verified account exists and a fresh anonymous browser is at the application entry.
          Seed prerequisites (prepared before this scenario):
          - verified account: {"nickname": "BookStack User", "email": "bookstack_user@example.com", "password": "Password123!"}
        When: Open Login, fill Email with bookstack_user@example.com and Password with Password123!, check Remember
          Me, and submit Login.
        Then: The authenticated homepage displays My Recent Drafts, My Recently Viewed, My Most Viewed Favorites
          and Recently Updated Pages as named regions.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-LOGIN)
        - \ref[image](IMG-INDEX-AFTER-LOGIN)
    children: []
- id: REQ-4
  name: Organize shelves
  description:
    text: |-
      Shelves contain a name, description, related books and tags. Support browsing, creation, editing, cancellation and confirmed deletion. Related-book editing remains part of the requirement even where not sampled by a test.

      For bootstrap shelf: Source only exposes New Shelf from an existing shelf. One immutable bootstrap shelf breaks that creation prerequisite; other shelves are UI-created.
  scenarios: []
  children:
  - id: REQ-4.1
    name: Browse shelves
    description:
      text: Activating "Shelves"(role=link) on the page displays "Shelf list"(role=region). Each shelf appears exactly
        once as a keyboard-accessible "{item name}"(role=button) identified by its business name; a semantically
        equivalent link is also permitted. No total list size is prescribed.
      image:
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
      - id: IMG-SHELVES
        reference: reference/shelves.png
        page: shelves
    scenarios:
    - id: SCN-REQ-4.1-01
      name: Show a uniquely identified item
      steps:
      - id: STEP-REQ-4.1-01-01
        Given: |-
          As an anonymous visitor, create a case-isolated Shelf 4.1 through the bootstrap shelf's New Shelf form, using Reference shelf description. and knowledge-base, docs as metadata.
          Seed prerequisites (prepared before this scenario):
          - bootstrap shelf: {"name": "Benchmark Bootstrap Shelf", "description": "Entry shelf for the New Shelf creation action.", "tags": [], "books": []}
        When: Click Shelves on the page and inspect Shelf list for the full isolated name.
        Then: The created shelf's opening entry appears exactly once and is visible and keyboard-accessible within
          Shelf list.
        references:
        - \ref[requirement](REQ-4.3)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-SHELVES)
    children: []
  - id: REQ-4.2
    name: Open shelf details
    description:
      text: Choosing "{item name}"(role=button) in "Shelf list"(role=region), or the allowed equivalent link, opens
        that shelf's details with a heading bearing its name and information belonging to the selected shelf. Its
        included books and related actions are available from these details.
      image:
      - id: IMG-SHELVES
        reference: reference/shelves.png
        page: shelves
      - id: IMG-SHELF
        reference: reference/shelf.png
        page: shelf
    scenarios:
    - id: SCN-REQ-4.2-01
      name: Open from global list
      steps:
      - id: STEP-REQ-4.2-01-01
        Given: |-
          An anonymous visitor has UI-created isolated Shelf 4.2.1 with Reference shelf description. and knowledge-base, docs.
          Seed prerequisites (prepared before this scenario):
          - bootstrap shelf: {"name": "Benchmark Bootstrap Shelf", "description": "Entry shelf for the New Shelf creation action.", "tags": [], "books": []}
        When: Click Shelves, then activate that exact shelf's entry within Shelf list.
        Then: The selected shelf's detail heading matches its full isolated name and its saved description is visible;
          a different shelf is not opened.
        references:
        - \ref[requirement](REQ-4.1)
        - \ref[image](IMG-SHELVES)
        - \ref[image](IMG-SHELF)
    children: []
  - id: REQ-4.3
    name: Create or abandon shelf
    description:
      text: |-
        While logged out, users open the bootstrap shelf through Shelves and Shelf list, then click "New Shelf"(role=button) to enter "Name"(role=textbox), "Description"(role=textbox), and "Tags"(role=textbox). "Save Shelf"(role=button) creates exactly one shelf with that metadata and returns to Shelf list; the metadata persists across navigation and reload. "Cancel"(role=button) instead returns to "Shelf list"(role=region) without creating the entered object. Runtime names may append the evaluator's run, worker, and case identity to source examples.

        The existing Benchmark Bootstrap Shelf has description Entry shelf for the New Shelf creation action., no tags and no books. It remains an immutable entry shelf for New Shelf; shelves created by the user are separate objects.
      image:
      - id: IMG-SHELVES
        reference: reference/shelves.png
        page: shelves
      - id: IMG-SHELF
        reference: reference/shelf.png
        page: shelf
      - id: IMG-CREATE-SHELF
        reference: reference/create_shelf.png
        page: shelf_form
    scenarios:
    - id: SCN-REQ-4.3-01
      name: Save a new shelf
      steps:
      - id: STEP-REQ-4.3-01-01
        Given: |-
          The anonymous application has bootstrap shelf and no shelf with the isolated Shelf Created 4.3.1 name.
          Seed prerequisites (prepared before this scenario):
          - bootstrap shelf: {"name": "Benchmark Bootstrap Shelf", "description": "Entry shelf for the New Shelf creation action.", "tags": [], "books": []}
        When: Open Shelves, select Benchmark Bootstrap Shelf, click New Shelf, enter the isolated name in Name,
          Shelf created by corresponding prerequisite behavior. in Description and created, shelf in Tags, then
          click Save Shelf. Open the saved shelf, reload and reopen Edit.
        Then: Saving returns to Shelf list with exactly one visible entry. The saved name, description and tags
          remain in the reopened metadata form after reload, demonstrating persistence of the entered metadata.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-SHELVES)
        - \ref[image](IMG-SHELF)
        - \ref[image](IMG-CREATE-SHELF)
    - id: SCN-REQ-4.3-02
      name: Cancel new shelf
      steps:
      - id: STEP-REQ-4.3-02-01
        Given: |-
          The anonymous browser has opened Benchmark Bootstrap Shelf through Shelves and Shelf list; the isolated Shelf Cancelled 4.3.2 does not exist.
          Seed prerequisites (prepared before this scenario):
          - bootstrap shelf: {"name": "Benchmark Bootstrap Shelf", "description": "Entry shelf for the New Shelf creation action.", "tags": [], "books": []}
        When: Click New Shelf, fill Name with the isolated title, Description with Unsaved shelf description 4.3.2.
          and Tags with cancelled, shelf, then click Cancel.
        Then: Shelf list (role=region) returns, with no entry for the unsaved name; none of the entered metadata creates a shelf.
        references:
        - \ref[requirement](REQ-1.1)
        - \ref[image](IMG-SHELVES)
        - \ref[image](IMG-SHELF)
        - \ref[image](IMG-CREATE-SHELF)
    children: []
  - id: REQ-4.5
    name: Edit or abandon shelf metadata
    description:
      text: |-
        On the selected shelf's details, "Edit"(role=button) opens "Name"(role=textbox), "Description"(role=textbox), and "Tags"(role=textbox) prefilled with saved values. "Save Shelf"(role=button) updates that same shelf and returns to its details with the updated heading and description; changes survive reload. "Cancel"(role=button) discards all pending changes and returns to the unchanged details.

        Related-book editing is supported. The shelf edit form exposes one checkbox per available book, named by that book's exact name and checked exactly when the book belongs to the shelf. Saving adds every checked book to this shelf and removes every unchecked book from this shelf only; removing a book neither deletes it nor removes it from another shelf. The same book may belong to multiple shelves.
      image:
      - id: IMG-SHELF
        reference: reference/shelf.png
        page: shelf
      - id: IMG-EDIT-SHELVE
        reference: reference/edit_shelve.png
        page: shelf_form
    scenarios:
    - id: SCN-REQ-4.5-01
      name: Save metadata changes
      steps:
      - id: STEP-REQ-4.5-01-01
        Given: |-
          UI-created isolated Shelf 4.5.1 has Reference shelf description. and knowledge-base, docs; its details are open anonymously.
          Seed prerequisites (prepared before this scenario):
          - bootstrap shelf: {"name": "Benchmark Bootstrap Shelf", "description": "Entry shelf for the New Shelf creation action.", "tags": [], "books": []}
        When: Click Edit and verify Name, Description and Tags are prefilled. Replace Name with isolated Shelf Updated
          4.5.1 and Description with Shelf updated by corresponding prerequisite behavior., retain the tags, and
          click Save Shelf. Reload the returned details and reopen Edit.
        Then: The updated heading and description are visible before and after reload. The reopened fields retain
          the updated name, description and tags on that same shelf.
        references:
        - \ref[requirement](REQ-4.2)
        - \ref[image](IMG-SHELF)
        - \ref[image](IMG-EDIT-SHELVE)
    - id: SCN-REQ-4.5-02
      name: Cancel metadata changes
      steps:
      - id: STEP-REQ-4.5-02-01
        Given: |-
          UI-created isolated Shelf 4.5.2 has Reference shelf description. and knowledge-base, docs; its details are open anonymously.
          Seed prerequisites (prepared before this scenario):
          - bootstrap shelf: {"name": "Benchmark Bootstrap Shelf", "description": "Entry shelf for the New Shelf creation action.", "tags": [], "books": []}
        When: Click Edit, replace Name with isolated Shelf Updated 4.5.2 and Description with Shelf updated by corresponding
          prerequisite behavior., then click Cancel.
        Then: Details return with the original heading and description and no heading for the replacement name;
          pending metadata was not committed.
        references:
        - \ref[requirement](REQ-4.2)
        - \ref[image](IMG-SHELF)
        - \ref[image](IMG-EDIT-SHELVE)
    - id: SCN-REQ-4.5-03
      name: Edit related books
      steps:
      - id: STEP-REQ-4.5-03-01
        Given: |-
          An anonymous visitor has UI-created isolated Shelf 4.5.3-T containing isolated Book 4.5.3-A, and isolated Shelf 4.5.3-S containing isolated Book 4.5.3-B; shelf 4.5.3-S details are open.
          Seed prerequisites (prepared before this scenario):
          - bootstrap shelf: {"name": "Benchmark Bootstrap Shelf", "description": "Entry shelf for the New Shelf creation action.", "tags": [], "books": []}
        When: Click Edit on shelf 4.5.3-S, verify Book 4.5.3-B is checked and Book 4.5.3-A is unchecked, check Book 4.5.3-A, uncheck Book 4.5.3-B, and click Save Shelf; open Books and Book 4.5.3-B, open shelf 4.5.3-T, and reopen Edit on shelf 4.5.3-S.
        Then: Shelf 4.5.3-S Book list contains Book 4.5.3-A exactly once and does not contain Book 4.5.3-B. The global Book list still contains both books. Book 4.5.3-B remains readable and no longer exposes shelf 4.5.3-S as a parent action; Book 4.5.3-A still exposes shelf 4.5.3-T, whose Book list contains it. Reopened Edit reports shelf 4.5.3-S with Book 4.5.3-A checked and Book 4.5.3-B unchecked.
        references:
        - \ref[requirement](REQ-4.2)
        - \ref[requirement](REQ-5.2)
        - \ref[requirement](REQ-5.6)
        - \ref[image](IMG-SHELF)
        - \ref[image](IMG-EDIT-SHELVE)
        - \ref[image](IMG-BOOKS)
    children: []
  - id: REQ-4.4
    name: Delete or retain shelf
    description:
      text: |-
        Clicking "Delete"(role=button) on a selected shelf opens confirmation. "Confirm Delete"(role=button) removes that shelf and returns to "Shelf list"(role=region), where its entry is absent; the deletion remains effective across navigation. "Cancel"(role=button) keeps the shelf and preserves its original heading and description.

        Deleting a shelf does not delete the books it contains. Contained books remain in the global Book list with their saved metadata, and the deleted shelf no longer appears as a parent action on those books.
      image:
      - id: IMG-DELETE-SHELVES
        reference: reference/delete_shelves.png
        page: shelf
      - id: IMG-SHELVES
        reference: reference/shelves.png
        page: shelves
    scenarios:
    - id: SCN-REQ-4.4-01
      name: Confirm deletion
      steps:
      - id: STEP-REQ-4.4-01-01
        Given: |-
          An anonymous visitor has UI-created isolated Shelf 4.4.1 with Reference shelf description. and is viewing that shelf's details.
          Seed prerequisites (prepared before this scenario):
          - bootstrap shelf: {"name": "Benchmark Bootstrap Shelf", "description": "Entry shelf for the New Shelf creation action.", "tags": [], "books": []}
        When: Click Delete, inspect confirmation with Confirm Delete and Cancel, then click Confirm Delete; reopen
          Shelves after reload.
        Then: Shelf list (role=region) returns and contains no entry for the deleted shelf before or after reload.
        references:
        - \ref[requirement](REQ-4.2)
        - \ref[image](IMG-DELETE-SHELVES)
        - \ref[image](IMG-SHELVES)
    - id: SCN-REQ-4.4-02
      name: Cancel deletion
      steps:
      - id: STEP-REQ-4.4-02-01
        Given: |-
          An anonymous visitor has UI-created isolated Shelf 4.4.2 with Reference shelf description. and is viewing its details.
          Seed prerequisites (prepared before this scenario):
          - bootstrap shelf: {"name": "Benchmark Bootstrap Shelf", "description": "Entry shelf for the New Shelf creation action.", "tags": [], "books": []}
        When: Click Delete and then Cancel in the confirmation.
        Then: The same shelf details remain, with the original heading and Reference shelf description.; the shelf
          is not deleted.
        references:
        - \ref[requirement](REQ-4.2)
        - \ref[image](IMG-DELETE-SHELVES)
        - \ref[image](IMG-SHELVES)
    - id: SCN-REQ-4.4-03
      name: Retain books after shelf deletion
      steps:
      - id: STEP-REQ-4.4-03-01
        Given: |-
          An anonymous visitor has UI-created isolated Shelf 4.4.3 containing isolated Book 4.4.3 through that shelf's Create New Book form; the book is also available in the global Book list.
          Seed prerequisites (prepared before this scenario):
          - bootstrap shelf: {"name": "Benchmark Bootstrap Shelf", "description": "Entry shelf for the New Shelf creation action.", "tags": [], "books": []}
        When: Open the shelf, click Delete, click Confirm Delete, then open Books and the isolated book; reload the book detail.
        Then: Shelf list no longer contains the deleted shelf. Book list still contains the isolated book exactly once, and its heading and saved description remain after reload. The book detail no longer exposes the deleted shelf as a parent action.
        references:
        - \ref[requirement](REQ-4.2)
        - \ref[requirement](REQ-5.6)
        - \ref[image](IMG-DELETE-SHELVES)
        - \ref[image](IMG-BOOKS)
        - \ref[image](IMG-BOOK)
    children: []
- id: REQ-5
  name: Manage books
  description:
    text: Books contain a name, rich-text description, optional cover image, tags, default page template, chapters
      and pages. Support creation from the global list and from a shelf, metadata editing and confirmed deletion.
      Optional cover and default-template behavior are retained but not sampled; the source gives no format or template
      catalog rules.
  scenarios: []
  children:
  - id: REQ-5.1
    name: Browse books
    description:
      text: Clicking "Books"(role=link) on the page displays "Book list"(role=region). Each book appears exactly
        once as a keyboard-accessible "{item name}"(role=button) identified by its business name, with an equivalent
        link also allowed. No total list size is prescribed.
      image:
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
      - id: IMG-BOOKS
        reference: reference/books.png
        page: books
    scenarios:
    - id: SCN-REQ-5.1-01
      name: Show a uniquely identified item
      steps:
      - id: STEP-REQ-5.1-01-01
        Given: An anonymous visitor has UI-created isolated Book 5.1 with Reference book description. and manual,
          handbook through Books, Create New Book, metadata fields and Save Book.
        When: Click Books on the page and inspect Book list.
        Then: Exactly one visible keyboard-accessible opening entry identifies that full isolated book name.
        references:
        - \ref[requirement](REQ-5.3)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-BOOKS)
    children: []
  - id: REQ-5.2
    name: Open book details
    description:
      text: Selecting "{item name}"(role=button), or its allowed equivalent link, in "Book list"(role=region) opens
        the corresponding book's details with its name as the heading and information belonging to that book. The
        same selection behavior is available from the Book list on its containing shelf.
      image:
      - id: IMG-BOOKS
        reference: reference/books.png
        page: books
      - id: IMG-SHELF
        reference: reference/shelf.png
        page: shelf
      - id: IMG-BOOK
        reference: reference/book.png
        page: book
    scenarios:
    - id: SCN-REQ-5.2-01
      name: Open from global list
      steps:
      - id: STEP-REQ-5.2-01-01
        Given: An anonymous visitor has UI-created isolated Book 5.2.1 with Reference book description. and manual,
          handbook.
        When: Click Books, then activate the exact book entry in Book list.
        Then: The opened detail heading is that book's name and its saved description is visible.
        references:
        - \ref[requirement](REQ-5.1)
        - \ref[image](IMG-BOOKS)
        - \ref[image](IMG-SHELF)
        - \ref[image](IMG-BOOK)
    - id: SCN-REQ-5.2-02
      name: Open from containing shelf
      steps:
      - id: STEP-REQ-5.2-02-01
        Given: |-
          Through UI, create isolated Shelf 5.2.2 and then Book 5.2.2 from that shelf's Create New Book form, associating the two objects.
          Seed prerequisites (prepared before this scenario):
          - bootstrap shelf: {"name": "Benchmark Bootstrap Shelf", "description": "Entry shelf for the New Shelf creation action.", "tags": [], "books": []}
        When: Follow the containing shelf's named parent entry, then choose the isolated book from that shelf's
          Book list.
        Then: The selected book detail heading matches its name and the shelf-created description is visible, preserving
          the parent association.
        references:
        - \ref[requirement](REQ-5.6)
        - \ref[image](IMG-BOOKS)
        - \ref[image](IMG-SHELF)
        - \ref[image](IMG-BOOK)
    children: []
  - id: REQ-5.3
    name: Create or abandon book
    description:
      text: |-
