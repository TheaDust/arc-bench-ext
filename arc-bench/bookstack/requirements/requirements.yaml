- id: REQ-6
  name: Author and read content
  description:
    text: Pages are reading units, chapters organize pages. Support published pages, user-owned drafts, draft deletion,
      chapter creation and entry, and reading pages from book or chapter page lists.
  scenarios: []
  children:
  - id: REQ-6.1
    name: Publish or save a draft page
    description:
      text: |-
        Clicking "New Page"(role=button) on a book opens "Page title"(role=textbox) and "Write your page content here..."(role=textbox). "Save Page"(role=button) publishes the entered title and body, returns to the book, and adds exactly one entry to "Page list"(role=region), including while logged out. When authenticated, users can instead click "Save Draft"(role=button) to save an owned draft, which appears exactly once as visible title text in the homepage's "My Recent Drafts"(role=region). This title may be plain text or an interactive entry. Saved drafts can be reopened from the parent book's Page list to resume editing or delete them. REQ-2.2 is required only for the Save Draft branch.

        Dates and time-dependent content use UTC and the shared clock 2026-10-06T12:00:00Z.

        Published pages can be organized under a chapter belonging to their parent book. Saving keeps the book/chapter association so that the page is readable from the appropriate chapter Page list as well as its book context. Drafts belong to the authenticated author and their parent book.

        An owned draft is visible only to its author. Anonymous visitors do not see it in the parent book's Page list, and the anonymous homepage does not contain its title. Other verified users do not see it in the parent book's Page list or in My Recent Drafts. Neither can open the draft. The author can open the draft and click "Save Page"(role=button) to publish it under the same parent book; publishing removes it from My Recent Drafts, adds it exactly once to the parent book's Page list, makes it readable anonymously, and places it in Recently Updated Pages without creating a duplicate page.
      image:
      - id: IMG-BOOK
        reference: reference/book.png
        page: book
      - id: IMG-PAGE-DRAFT
        reference: reference/page_draft.png
        page: page_editor
      - id: IMG-INDEX-AFTER-LOGIN
        reference: reference/index_after_login.png
        page: home
    scenarios:
    - id: SCN-REQ-6.1-01
      name: Publish a page
      steps:
      - id: STEP-REQ-6.1-01-01
        Given: An anonymous visitor has UI-created isolated Book 6.1.1 and is viewing it; isolated Page Created
          6.1.1 does not exist.
        When: Click New Page, fill Page title with the isolated name and Write your page content here... with Page
          content created by corresponding prerequisite behavior., then Save Page.
        Then: The parent book returns with exactly one visible Page list entry for the saved page, without requiring
          login.
        references:
        - \ref[requirement](REQ-5.3)
        - \ref[image](IMG-BOOK)
        - \ref[image](IMG-PAGE-DRAFT)
        - \ref[image](IMG-INDEX-AFTER-LOGIN)
    - id: SCN-REQ-6.1-02
      name: Save an owned recent draft
      steps:
      - id: STEP-REQ-6.1-02-01
        Given: |-
          Log in through Email and Password as verified account, create isolated Book 6.1.2 through UI, and open that book.
          Seed prerequisites (prepared before this scenario):
          - verified account: {"nickname": "BookStack User", "email": "bookstack_user@example.com", "password": "Password123!"}
        When: Click New Page, enter isolated Page Draft 6.1.2 and Draft content created by corresponding prerequisite
          behavior., then Save Draft. Open the parent book if the editor remains and open / to return home.
        Then: The parent Page list contains exactly one draft entry; the authenticated My Recent Drafts region also
          contains that draft title exactly once and visibly.
        references:
        - \ref[requirement](REQ-5.3)
        - \ref[requirement](REQ-2.2)
        - \ref[image](IMG-BOOK)
        - \ref[image](IMG-PAGE-DRAFT)
        - \ref[image](IMG-INDEX-AFTER-LOGIN)
    - id: SCN-REQ-6.1-03
      name: Publish an owned draft
      steps:
      - id: STEP-REQ-6.1-03-01
        Given: |-
          The verified account is authenticated and has UI-created isolated Book 6.1.3 with owned draft Page Draft 6.1.3. A fresh anonymous browser has that book open in a separate context.
          Seed prerequisites (prepared before this scenario):
          - verified account: {"nickname": "BookStack User", "email": "bookstack_user@example.com", "password": "Password123!"}
        When: In the anonymous context, inspect the book's Page list. In the authenticated context, open the draft from the parent book's Page list, click Save Page, then open the book and the homepage; reload the anonymous book.
        Then: Before publishing, the anonymous Page list does not contain the draft. After publishing, the draft is absent from My Recent Drafts, appears exactly once in the parent book's Page list and in Recently Updated Pages, and the anonymous browser can open it and read its saved body. Reload preserves the published page and does not create a duplicate.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[requirement](REQ-5.3)
        - \ref[requirement](REQ-9.1)
        - \ref[image](IMG-PAGE-DRAFT)
        - \ref[image](IMG-INDEX-AFTER-LOGIN)
        - \ref[image](IMG-PAGE)
    - id: SCN-REQ-6.1-04
      name: Keep drafts private to their owner
      steps:
      - id: STEP-REQ-6.1-04-01
        Given: |-
          The verified account is authenticated and has UI-created isolated Book 6.1.4 with owned draft Page Draft 6.1.4. A fresh anonymous browser and a second verified account have that book open in separate contexts.
          Seed prerequisites (prepared before this scenario):
          - verified account: {"nickname": "BookStack User", "email": "bookstack_user@example.com", "password": "Password123!"}
          - second verified account: {"nickname": "BookStack Reviewer", "email": "bookstack_reviewer@example.com", "password": "Password123!"}
        When: Inspect the book's Page list and My Recent Drafts as the anonymous visitor and as the second verified account; attempt to open the draft by the URL observed for its owner; then reopen the parent book as the owner.
        Then: Neither the anonymous visitor nor the second account sees the draft in the parent book's Page list; the second account's My Recent Drafts does not contain it and the anonymous homepage does not contain the draft title. Neither can open the draft editor or read its body from the observed URL. The owner still sees the draft exactly once in the parent book's Page list and in My Recent Drafts.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[requirement](REQ-5.3)
        - \ref[image](IMG-PAGE-DRAFT)
        - \ref[image](IMG-INDEX-AFTER-LOGIN)
    children: []
