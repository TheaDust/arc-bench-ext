- id: REQ-8
  name: Personal favorites
  description:
    text: Authenticated users can favorite and unfavorite shelves, books, chapters and pages. My Most Viewed Favorites
      contains at most four items, and a dedicated favorites page exposes the complete collection. Ranking ties
      and the name of the complete-list entry are not specified; these are not tested.
  scenarios: []
  children:
  - id: REQ-8.1
    name: Favorite and unfavorite content
    description:
      text: |-
        On an authenticated shelf, book, chapter, or page details view, "Favorite"(role=button) initially exposes aria-pressed=false. Clicking it stores a personal favorite and changes the action to "Unfavorite"(role=button) with aria-pressed=true. Clicking Unfavorite removes the preference and restores Favorite with aria-pressed=false. The selected state persists after reload and follows the same behavior for all four content types.

        Favorites and unfavorites are scoped to the authenticated user; another account does not acquire the same personal preference. Saved preferences remain consistent across navigation as well as reload. Deleting favorited content removes it from the owner's favorite projections.
      image:
      - id: IMG-BOOK
        reference: reference/book.png
        page: book
      - id: IMG-FAVOURITES
        reference: reference/favourites.png
        page: favourites
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
    scenarios:
    - id: SCN-REQ-8.1-01
      name: Favorite a book
      steps:
      - id: STEP-REQ-8.1-01-01
        Given: |-
          verified account is authenticated and is viewing UI-created isolated Book 8.1; Favorite starts with pressed=false.
          Seed prerequisites (prepared before this scenario):
          - verified account: {"nickname": "BookStack User", "email": "bookstack_user@example.com", "password": "Password123!"}
        When: Click Favorite on that book's details.
        Then: The action changes to Unfavorite and reports pressed=true for that book.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[requirement](REQ-5.3)
        - \ref[image](IMG-BOOK)
        - \ref[image](IMG-FAVOURITES)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-8.1-02
      name: Persist removal of a favorite
      steps:
      - id: STEP-REQ-8.1-02-01
        Given: |-
          verified account is authenticated and has UI-created isolated Book Unfavorite; it has not yet been favorited.
          Seed prerequisites (prepared before this scenario):
          - verified account: {"nickname": "BookStack User", "email": "bookstack_user@example.com", "password": "Password123!"}
        When: Click Favorite, reload, click Unfavorite, reload again, and open / to return home.
        Then: After the first reload Unfavorite still reports pressed=true; after removal Favorite reports pressed=false
          before and after reload. My Most Viewed Favorites has no entry for the removed book.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[requirement](REQ-5.3)
        - \ref[image](IMG-BOOK)
        - \ref[image](IMG-FAVOURITES)
        - \ref[image](IMG-INDEX)
    - id: SCN-REQ-8.1-03
      name: Keep favorites personal and remove deleted content
      steps:
      - id: STEP-REQ-8.1-03-01
        Given: |-
          The verified account is authenticated and has UI-created isolated Book 8.1.3; the book is favorited by that account. A second verified account has not favorited it.
          Seed prerequisites (prepared before this scenario):
          - verified account: {"nickname": "BookStack User", "email": "bookstack_user@example.com", "password": "Password123!"}
          - second verified account: {"nickname": "BookStack Reviewer", "email": "bookstack_reviewer@example.com", "password": "Password123!"}
        When: As the second account, open the book and inspect the Favorite control and homepage. As the verified account, open the book and click Delete then Confirm Delete, then open the homepage; reload the second account's homepage.
        Then: The verified account's My Most Viewed Favorites contains the book exactly once, while the second account's Favorite remains pressed=false and its favorites do not contain the book. After deletion, the book is absent from both accounts' favorites and from Book list. Reload preserves the absence.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[requirement](REQ-5.3)
        - \ref[requirement](REQ-5.5)
        - \ref[image](IMG-BOOK)
        - \ref[image](IMG-INDEX-AFTER-LOGIN)
        - \ref[image](IMG-BOOKS)
    children: []
  - id: REQ-8.2
    name: Open a homepage favorite
    description:
      text: |-
        After an item is favorited, the authenticated homepage's "My Most Viewed Favorites"(role=region) exposes that item as "{favorite item name}"(role=button), with an equivalent link also permitted. The region contains at most four items; selecting an entry opens the corresponding item. A dedicated favorites page exposes the complete collection.

        Ranking ties and the name of the complete favorites collection entry are unspecified.

        Each business record in this homepage region has exactly one listitem or row role and contains its one named opening button or link. Auxiliary navigation and action controls are outside those records. Records have distinct object identities. For the cap check, prepare more distinct eligible items than the limit through the public creation/visit/favorite actions, then select one of the displayed prepared items; no ranking tie-breaker is required.
      image:
      - id: IMG-INDEX-AFTER-LOGIN
        reference: reference/index_after_login.png
        page: home
      - id: IMG-FAVOURITES
        reference: reference/favourites.png
        page: favourites
      - id: IMG-BOOK
        reference: reference/book.png
        page: book
    scenarios:
    - id: SCN-REQ-8.2-01
      name: Open favorited book
      steps:
      - id: STEP-REQ-8.2-01-01
        Given: |-
          verified account is authenticated and has UI-created isolated Book 8.2, then clicked Favorite and observed Unfavorite with pressed=true.
          Seed prerequisites (prepared before this scenario):
          - verified account: {"nickname": "BookStack User", "email": "bookstack_user@example.com", "password": "Password123!"}
        When: Open /, inspect My Most Viewed Favorites and activate the exact isolated book entry there.
        Then: The favorite entry appears once in a list of no more than four items and opens the same book's heading.
        references:
        - \ref[requirement](REQ-8.1)
        - \ref[image](IMG-INDEX-AFTER-LOGIN)
        - \ref[image](IMG-FAVOURITES)
        - \ref[image](IMG-BOOK)
    children: []
- id: REQ-9
  name: Recently updated pages
  description:
    text: The homepage shows at most five recently created or edited pages and opens a selected page. The source
      does not define ranking tie-breakers.
  scenarios: []
  children:
  - id: REQ-9.1
    name: Open a recently updated page
    description:
      text: |-
        Creating or editing a page updates "Recently Updated Pages"(role=region) on the homepage. This region contains at most five items, and selecting "{page title}"(role=button), or the permitted equivalent link, opens that page with its saved title and body.

        Ranking tie-breakers are unspecified.

        Dates and time-dependent content use UTC and the shared clock 2026-10-06T12:00:00Z.

        Each business record in this homepage region has exactly one listitem or row role and contains its one named opening button or link. Auxiliary navigation and action controls are outside those records. Records have distinct object identities. For the cap check, prepare more distinct eligible items than the limit through the public creation/visit/favorite actions, then select one of the displayed prepared items; no ranking tie-breaker is required.
      image:
      - id: IMG-INDEX
        reference: reference/index.png
        page: home
      - id: IMG-PAGE
        reference: reference/page.png
        page: page
    scenarios:
    - id: SCN-REQ-9.1-01
      name: Open recently published page
      steps:
      - id: STEP-REQ-9.1-01-01
        Given: An anonymous visitor has UI-created isolated Book 9.1 and published isolated Page Updated 9.1 with
          Page content created by corresponding prerequisite behavior.
        When: Open / and select that page's exact entry in Recently Updated Pages.
        Then: The list has no more than five entries and includes the new page once; selection opens its saved heading
          and body.
        references:
        - \ref[requirement](REQ-6.1)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-PAGE)
    - id: SCN-REQ-9.1-02
      name: Edit updates recently updated page
      steps:
      - id: STEP-REQ-9.1-02-01
        Given: An anonymous visitor has UI-published isolated Page 9.1.2 with Reading content for Page 9.1.2. under isolated Book 9.1.2.
        When: Open the page from the parent Page list, click Edit, replace its title with isolated Page Updated 9.1.2 and body with Updated content for Page 9.1.2., click Save Page, open the homepage, and activate the updated page entry.
        Then: Recently Updated Pages contains the updated title exactly once and does not contain the old title; selecting the entry opens the page with its updated heading and body. The region contains no more than five records; reload preserves the result.
        references:
        - \ref[requirement](REQ-6.4)
        - \ref[image](IMG-INDEX)
        - \ref[image](IMG-PAGE)
    children: []
- id: REQ-10
  name: Content lifecycle and relational integrity
  description:
    text: |-
      Published pages and chapters can be deleted with confirmation. Deletion and membership changes keep the hierarchy, global lists, personal projections and homepage regions consistent, and do not remove unrelated content.
  scenarios: []
  children:
  - id: REQ-10.1
    name: Delete a published page
    description:
      text: |-
        On a published page's reading view, "Delete"(role=button) opens a confirmation with "Confirm Delete"(role=button) and "Cancel"(role=button). Confirming removes that page and returns to its parent book. The page is not readable from its former URL and is absent from the book and chapter "Page list"(role=region), from "Recently Updated Pages"(role=region), and from the author's favorites and recently viewed entries. Cancel keeps the page with its saved title and body. Deletion persists across reload and does not remove sibling pages.
      image:
      - id: IMG-PAGE
        reference: reference/page.png
        page: page
      - id: IMG-BOOK
        reference: reference/book.png
        page: book
      - id: IMG-INDEX-AFTER-LOGIN
        reference: reference/index_after_login.png
        page: home
    scenarios:
    - id: SCN-REQ-10.1-01
      name: Confirm page deletion
      steps:
      - id: STEP-REQ-10.1-01-01
        Given: |-
          The verified account is authenticated and has UI-created isolated Book 10.1.1 with Chapter 10.1.1 and Page 10.1.1 and sibling Page 10.1.1-Sibling. Page 10.1.1 is favorited and has been opened in the current session.
          Seed prerequisites (prepared before this scenario):
          - verified account: {"nickname": "BookStack User", "email": "bookstack_user@example.com", "password": "Password123!"}
        When: Open Page 10.1.1, click Delete, click Confirm Delete, then open the parent book and Chapter 10.1.1; open the homepage and reload the book.
        Then: The parent book returns with Page 10.1.1 absent from its Page list and Page 10.1.1-Sibling present; Chapter 10.1.1's Page list no longer contains Page 10.1.1. Recently Updated Pages, My Most Viewed Favorites and My Recently Viewed no longer contain Page 10.1.1. Reload preserves the page's absence.
        references:
        - \ref[requirement](REQ-5.3)
        - \ref[requirement](REQ-6.1)
        - \ref[requirement](REQ-6.3)
        - \ref[requirement](REQ-7.1)
        - \ref[requirement](REQ-8.1)
        - \ref[image](IMG-PAGE)
        - \ref[image](IMG-BOOK)
        - \ref[image](IMG-INDEX-AFTER-LOGIN)
    - id: SCN-REQ-10.1-02
      name: Cancel page deletion
      steps:
      - id: STEP-REQ-10.1-02-01
        Given: An anonymous visitor has UI-published isolated Page 10.1.2 with Page content 10.1.2. under isolated Book 10.1.2.
        When: Open the page from the parent Page list, click Delete, click Cancel, and reload the page.
        Then: The page remains with its saved heading and body. The parent Page list contains it exactly once, and Recently Updated Pages still contains it. Reload preserves the page.
        references:
        - \ref[requirement](REQ-6.1)
        - \ref[image](IMG-PAGE)
        - \ref[image](IMG-BOOK)
    children: []
  - id: REQ-10.2
    name: Delete a chapter
    description:
      text: |-
        On a chapter's detail view, "Delete"(role=button) opens a confirmation with "Confirm Delete"(role=button) and "Cancel"(role=button). Confirming removes that chapter and its pages, and returns to the parent book. The chapter is absent from "Chapter list"(role=region); its pages are not readable from their former URLs and are absent from the book "Page list"(role=region) and from "Recently Updated Pages"(role=region), favorites and recently viewed. Pages directly under the book or belonging to another chapter remain. Cancel keeps the chapter and its pages. Deletion persists across reload.
      image:
      - id: IMG-CHAPTER
        reference: reference/chapter.png
        page: chapter
      - id: IMG-BOOK
        reference: reference/book.png
        page: book
    scenarios:
    - id: SCN-REQ-10.2-01
      name: Confirm chapter deletion
      steps:
      - id: STEP-REQ-10.2-01-01
        Given: |-
          The verified account is authenticated and has UI-created isolated Book 10.2.1 with Chapter 10.2.1 containing Page 10.2.1-A and Page 10.2.1-B, plus root Page 10.2.1-Root and Chapter 10.2.1-Other containing Page 10.2.1-Other-Page. Chapter 10.2.1 and Page 10.2.1-A are favorited and have been opened in the current session.
          Seed prerequisites (prepared before this scenario):
          - verified account: {"nickname": "BookStack User", "email": "bookstack_user@example.com", "password": "Password123!"}
        When: Open Chapter 10.2.1, click Delete, click Confirm Delete, then open the parent book and Chapter 10.2.1-Other; open the homepage, attempt the former Page 10.2.1-A URL, and reload.
        Then: Chapter list no longer contains Chapter 10.2.1 and still contains Chapter 10.2.1-Other. The former chapter pages are absent from the parent book's Page list and are not readable from their former URLs; Page 10.2.1-Root and Page 10.2.1-Other-Page remain. Recently Updated Pages, My Most Viewed Favorites and My Recently Viewed no longer contain Chapter 10.2.1 or Page 10.2.1-A. Reload preserves the chapter's absence.
        references:
        - \ref[requirement](REQ-6.1)
        - \ref[requirement](REQ-6.3)
        - \ref[requirement](REQ-7.1)
        - \ref[requirement](REQ-8.1)
        - \ref[image](IMG-CHAPTER)
        - \ref[image](IMG-BOOK)
        - \ref[image](IMG-INDEX-AFTER-LOGIN)
    - id: SCN-REQ-10.2-02
      name: Cancel chapter deletion
      steps:
      - id: STEP-REQ-10.2-02-01
        Given: An anonymous visitor has UI-published isolated Chapter 10.2.2 with Page 10.2.2 under isolated Book 10.2.2.
        When: Open the chapter, click Delete, click Cancel, and reload the chapter.
        Then: The chapter remains with its saved heading and description, and its Page list still contains the saved page. No chapter or page is deleted.
        references:
        - \ref[requirement](REQ-6.3)
        - \ref[image](IMG-CHAPTER)
        - \ref[image](IMG-BOOK)
    children: []
