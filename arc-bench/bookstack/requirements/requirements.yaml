        reference: reference/shelves.png
        page: shelves
      - id: IMG-SHELF
        reference: reference/shelf.png
        page: shelf
      - id: IMG-BOOKS
        reference: reference/books.png
        page: books
      - id: IMG-BOOK
        reference: reference/book.png
        page: book
      - id: IMG-CHAPTER
        reference: reference/chapter.png
        page: chapter
      - id: IMG-PAGE
        reference: reference/page.png
        page: page
      - id: IMG-INDEX-AFTER-LOGIN
        reference: reference/index_after_login.png
        page: home
    scenarios:
    - id: SCN-REQ-7.1-01
      name: Record shelf visit
      steps:
      - id: STEP-REQ-7.1-01-01
        Given: |-
          verified account is authenticated and isolated Shelf 7.1 has been created through the public shelf form.
          Seed prerequisites (prepared before this scenario):
          - verified account: {"nickname": "BookStack User", "email": "bookstack_user@example.com", "password": "Password123!"}
          - bootstrap shelf: {"name": "Benchmark Bootstrap Shelf", "description": "Entry shelf for the New Shelf creation action.", "tags": [], "books": []}
        When: Open the exact shelf from Shelves and Shelf list, then open / to return home.
        Then: My Recently Viewed contains exactly one entry for that visited shelf, with the region containing no
          more than ten records.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[requirement](REQ-4.2)
        - \ref[image](IMG-SHELVES)
        - \ref[image](IMG-SHELF)
        - \ref[image](IMG-BOOKS)
        - \ref[image](IMG-BOOK)
        - \ref[image](IMG-CHAPTER)
        - \ref[image](IMG-PAGE)
        - \ref[image](IMG-INDEX-AFTER-LOGIN)
    - id: SCN-REQ-7.1-02
      name: Reopen visited shelf
      steps:
      - id: STEP-REQ-7.1-02-01
        Given: |-
          verified account is authenticated and isolated Shelf 7.2 has been UI-created and visited through Shelf list.
          Seed prerequisites (prepared before this scenario):
          - verified account: {"nickname": "BookStack User", "email": "bookstack_user@example.com", "password": "Password123!"}
          - bootstrap shelf: {"name": "Benchmark Bootstrap Shelf", "description": "Entry shelf for the New Shelf creation action.", "tags": [], "books": []}
        When: Open / to return home and click that shelf's exact entry in My Recently Viewed.
        Then: The recent list exposes the identity exactly once and selecting it opens that same shelf's heading.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[requirement](REQ-4.2)
        - \ref[image](IMG-SHELVES)
        - \ref[image](IMG-SHELF)
        - \ref[image](IMG-BOOKS)
        - \ref[image](IMG-BOOK)
        - \ref[image](IMG-CHAPTER)
        - \ref[image](IMG-PAGE)
        - \ref[image](IMG-INDEX-AFTER-LOGIN)
    - id: SCN-REQ-7.1-03
      name: Deduplicate and isolate recent views
      steps:
      - id: STEP-REQ-7.1-03-01
        Given: |-
          The verified account is authenticated and has UI-created isolated Shelf 7.3-A; a second verified account has UI-created isolated Shelf 7.3-B. Both shelves are available from the shared Shelf list.
          Seed prerequisites (prepared before this scenario):
          - verified account: {"nickname": "BookStack User", "email": "bookstack_user@example.com", "password": "Password123!"}
          - second verified account: {"nickname": "BookStack Reviewer", "email": "bookstack_reviewer@example.com", "password": "Password123!"}
        When: Open Shelf 7.3-A twice as the verified account, then open Shelf 7.3-B as the second account; open the homepage as each account and reload the verified account's homepage.
        Then: The verified account's My Recently Viewed contains Shelf 7.3-A exactly once and not Shelf 7.3-B. The second account's My Recently Viewed contains Shelf 7.3-B and not Shelf 7.3-A. Both regions contain no more than ten records; the verified account's single entry survives reload.
        references:
        - \ref[requirement](REQ-2.2)
        - \ref[requirement](REQ-4.2)
        - \ref[image](IMG-SHELF)
        - \ref[image](IMG-INDEX-AFTER-LOGIN)
